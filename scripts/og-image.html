        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

          linear-gradient(160deg, #0a0a0c 0%, #151517 46%, #2a2a2f 78%, #45454b 100%);

        color: #ffffff;

      .lockup {
        display: flex;
        align-items: center;
        gap: 14px;
      }

        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.035em;

        font-weight: 400;
        line-height: 1.45;
