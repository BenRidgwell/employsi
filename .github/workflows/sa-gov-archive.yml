# Daily SA Government → D1 archive (hosted, off your PC).
#
# iworkfor.sa.gov.au (BigRedSky) renders its result table entirely client-side.
# A headless Chromium on GitHub's runner does NOT work — the datacenter IP is
# bot-blocked and the run rendered 0 rows. So this fetches through the Oxylabs
# Web Scraper API (residential IP + server-side JS render) and parses the
# finished DOM — no browser, same path as the Indeed/LinkedIn/NSW/APS archives.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN  — a token with D1 edit on the employsi account
#                           (the same one the SEEK workflow uses).
# Optional repo variables (fall back to the values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + GitHub notification) if the board renders no
# rows — the degradation signal for this path. Use "Run workflow" (workflow_
# dispatch) to verify it on the runner before relying on the schedule.

name: sa-gov-archive

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC daily (~04:30 ACST) — before the SEEK run
  workflow_dispatch: {}

concurrency:
  group: sa-gov-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      - name: Scrape SA gov → D1 (Oxylabs)
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/sa-gov-to-d1.py --max-pages 40
