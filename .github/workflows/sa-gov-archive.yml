# Daily SA Government → D1 archive (hosted, off your PC).
#
# iworkfor.sa.gov.au runs a BigRedSky ATS. The board is NOT IP-blocked and needs
# no browser: the earlier "0 rows" runs were reading the SEARCH FORM page, which
# never contains results. The real flow (reverse-engineered against the live
# board) is GET the start URL for a session cookie + jobboard_token, then POST
# page.php?pageID=842 with action=Search and Start=<offset>; that response
# carries the server-rendered report table. So this is plain urllib — no
# Playwright, no Oxylabs.
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN  — a token with D1 edit on the employsi account
#                           (the same one the SEEK workflow uses).
# Optional repo variables (fall back to the values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + GitHub notification) if the board renders no
# rows — the degradation signal for this path. Use "Run workflow" (workflow_
# dispatch) to verify it on the runner before relying on the schedule.

name: sa-gov-archive

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC daily (~04:30 ACST) — before the SEEK run
  workflow_dispatch: {}

concurrency:
  group: sa-gov-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      - name: Scrape SA gov → D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # No --max-pages: the script's default (120) is a runaway guard well
        # clear of the board's real size, and the walk stops on its own when a
        # page returns no new titles. Pinning 40 here capped collection at 800
        # of the 874 records the board reports.
        run: python scripts/sa-gov-to-d1.py
