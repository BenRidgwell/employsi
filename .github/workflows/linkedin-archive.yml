# LinkedIn → D1 archive via the Oxylabs Web Scraper API. NO LONGER SCHEDULED —
# dispatch-only since 2026-08-29; brightdata-archive.yml collects LinkedIn now.
#
# LinkedIn blocks datacenter IPs (429 / auth-wall), so instead of a browser this
# fetches LinkedIn's guest jobs-search HTML through the Oxylabs Web Scraper API
# (which supplies the residential IP + rendering) and parses the returned job
# cards — no Playwright, so it runs on an ordinary GitHub runner. Every role is
# skill-mapped and deduped against the other sources (Adzuna/SEEK/Indeed/gov)
# before archival, and re-seen roles refresh their last_seen for history.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Exits non-zero (red X) if LinkedIn starts returning nothing. Use "Run workflow"
# to verify before relying on the schedule.
#
# A SECOND TRANSPORT ARRIVED 2026-09-24: `transport: direct`, the default for a
# dispatch. The same guest endpoint, fetched straight from the runner — no
# Oxylabs, no Bright Data, no per-record bill — and searched BY COMPANY ID
# (scripts/linkedin_company_ids.json) where one has been resolved. It is here
# to earn LinkedIn's way off brightdata-archive.yml.
#
# THE RUNNER'S ADDRESS IS ALREADY ANSWERED. Run #37 (2026-09-24, through the
# JobSpy package) walked all 395 companies in 75.5 min with no 429 and no
# authwall. JobSpy was then dropped: its LinkedIn pager skips pages (BHP: 40
# cards of 91) and it blanks locations it cannot split. The block above
# guest_get() in scripts/linkedin-to-d1.py has the measurements.
#
# `solve` DEFAULTS TO TRUE, so a dispatch writes nothing unless it is unticked.
# A solve run with the D1 token also measures job_key continuity against the
# LinkedIn rows Bright Data wrote: a title that matches under a DIFFERENT key
# would be counted twice after a switch, and that is worth knowing first.
#
# SCHEDULED WEEKLY FROM 2026-09-25, on the direct transport, and it replaces
# brightdata-archive.yml's LinkedIn sweep (whose schedule is removed in the
# same change: both write `source=linkedin`). Earned the way indeed-archive.yml
# earned its schedule — a full-roster solve from a hosted runner, then a
# full-roster write — see the `schedule` block below for the numbers.

name: linkedin-archive

on:
  # WEEKLY, MONDAY 17:20 UTC — the slot brightdata-archive.yml's LinkedIn
  # sweep held, which is known to collide with nothing.
  #
  # What earned it, both from a hosted runner on 2026-09-24:
  #
  #   run #37  JobSpy, keyword    395 companies, 75.5 min, 0 blocked, 4,088 kept
  #   run #38  direct, by id      395 companies, 55.1 min, 0 blocked, 10,272
  #                               kept (7,603 from the 186 id searches, with
  #                               zero other-advertiser cards among them);
  #                               6,846 already in the archive under the SAME
  #                               job_key Bright Data wrote
  #
  # Bright Data's fortnightly sweep was ~27 records a company, ~10.6k a sweep,
  # billed per record. This is the same order of coverage for nothing.
  #
  # WEEKLY, NOT DAILY, BY CHOICE (2026-09-25). Daily would cost only runner
  # minutes now, and it is what keeps "currently advertised" (last_seen within
  # a day) true for LinkedIn's own rows. On a weekly cadence those rows read as
  # current on the day of the run and stale for the other six, as they did
  # under the fortnightly Bright Data sweep. Changing this line is the whole
  # of moving to daily.
  #
  # THE EARLIER REMOVAL, KEPT: it was '30 21 * * *' on Oxylabs until 2026-08-29,
  # when every request answered
  #
  #     oxylabs auth failed (401) — check OXYLABS_USERNAME/PASSWORD
  #
  # — the account rejected, not a quota. `transport: oxylabs` is still here for
  # dispatch, so re-testing it costs a dispatch rather than a rewrite. A feed
  # that fails every day trains everyone to ignore its failures; that one
  # masked LinkedIn collecting fine on Bright Data.
  schedule:
    - cron: '20 17 * * 1'
  workflow_dispatch:
    inputs:
      transport:
        description: 'direct = the guest API straight from the runner, by company id; oxylabs = the Web Scraper API (401 since 2026-08-28)'
        type: choice
        options: [direct, oxylabs]
        default: direct
      solve:
        description: 'Collect and report only — write nothing to D1'
        type: boolean
        default: true
      limit:
        description: 'Companies to walk (blank = the whole roster)'
        type: string
        default: ''
      concurrency:
        description: 'Parallel companies for direct (5 was measured; lower it if the run reports blocks)'
        type: string
        default: '5'

concurrency:
  group: linkedin-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # Run #37 took 75.5 min for the roster at 5 workers, most of it the 3-6s
    # pause between pages. An id search walks every page an employer has — NAB
    # is 18 — so budget more than that. 300 leaves room for a lower concurrency
    # without being cancelled mid-walk, which would report nothing about the
    # companies it never reached.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Scrape LinkedIn → D1
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          # `inputs` IS EMPTY ON A SCHEDULED RUN — a workflow_dispatch default
          # does not apply to a cron fire — so every input here carries its
          # fallback. A scheduled run is therefore direct, WRITING (solve is
          # empty, not true), whole roster, concurrency 5.
          TRANSPORT="${{ inputs.transport || 'direct' }}"
          if [ "$TRANSPORT" = "direct" ]; then
            python scripts/linkedin-to-d1.py --direct --location Australia \
              --concurrency "${{ inputs.concurrency || '5' }}" \
              ${{ inputs.solve && '--solve' || '' }} \
              ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
            exit $?
          fi
          # The whole roster; up to 10 guest-API pages (25 cards) each — the
          # driver stops early once a company yields no new ads.
          python scripts/linkedin-to-d1.py --location Australia --max-pages 10 --concurrency 8 \
            ${{ inputs.solve && '--solve' || '' }} \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
