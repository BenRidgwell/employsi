# Scraper-parser integrity check.
#
# The gov job boards (NSW = Next.js, APS = Salesforce Aura, SA = BigRedSky) all
# render client-side, and each has already broken us once by shipping its data
# somewhere the parser wasn't looking — the NSW rewrite returned 0 rows from a
# 499KB page because the vacancies live in the RSC flight payload, not anchors.
#
# scripts/jobs_extract.py is the shared, defensive extractor those scrapers use.
# These tests pin its behaviour against fixtures shaped like each board's real
# rendering (plus negative cases: challenge pages and nav JSON must yield NO
# jobs), so a regression fails here rather than silently archiving nothing at
# 04:30 with a red X nobody reads.
#
# Also byte-compiles every scraper so a syntax error can't reach a scheduled run.

name: scraper-check

on:
  push:
    paths:
      - 'scripts/jobs_extract.py'
      - 'scripts/oxylabs_client.py'
      - 'scripts/http_fetch.py'
      - 'scripts/*-to-d1.py'
      - 'scripts/test_jobs_extract.py'
      - 'scripts/test_rosters.py'
      # A reformat of these data files is what silently emptied the SEEK and
      # Zhaopin rosters, so a change to either has to re-run the parsers.
      - 'src/employsi/data/seekAdvertisers.ts'
      - 'src/employsi/data/chinaJobsTargets.ts'
      - '.github/workflows/scraper-check.yml'
  pull_request:
    paths:
      - 'scripts/jobs_extract.py'
      - 'scripts/oxylabs_client.py'
      - 'scripts/http_fetch.py'
      - 'scripts/*-to-d1.py'
      - 'src/employsi/data/seekAdvertisers.ts'
      - 'src/employsi/data/chinaJobsTargets.ts'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # test_rosters.py exercises seek-to-d1.py's advertiser loader, which reads
      # the map by running scripts/seek-advertisers.ts rather than regexing the
      # source (a company's advertisers are composed at runtime, so there is no
      # literal to match). Without bun that check would fail here for the wrong
      # reason — and the real seek-archive run already depends on bun anyway.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Job-extraction parser tests
        run: python scripts/test_jobs_extract.py

      - name: Roster parsers still read their data files
        run: python scripts/test_rosters.py

      - name: Byte-compile the scrapers
        run: python -m compileall -q scripts/*.py
