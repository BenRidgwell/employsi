# Scraper-parser integrity check.
#
# The gov job boards (NSW = Next.js, APS = Salesforce Aura, SA = BigRedSky) all
# render client-side, and each has already broken us once by shipping its data
# somewhere the parser wasn't looking — the NSW rewrite returned 0 rows from a
# 499KB page because the vacancies live in the RSC flight payload, not anchors.
#
# scripts/jobs_extract.py is the shared, defensive extractor those scrapers use.
# These tests pin its behaviour against fixtures shaped like each board's real
# rendering (plus negative cases: challenge pages and nav JSON must yield NO
# jobs), so a regression fails here rather than silently archiving nothing at
# 04:30 with a red X nobody reads.
#
# Also byte-compiles every scraper so a syntax error can't reach a scheduled run.

name: scraper-check

on:
  push:
    paths:
      - 'scripts/jobs_extract.py'
      - 'scripts/oxylabs_client.py'
      - 'scripts/http_fetch.py'
      - 'scripts/*-to-d1.py'
      - 'scripts/test_jobs_extract.py'
      - 'scripts/test_brightdata_download.py'
      - 'scripts/test_nsw_discovery.py'
      - 'scripts/nsw-gov-to-d1.py'
      - 'scripts/brightdata-to-d1.py'
      - 'scripts/test_rosters.py'
      - 'scripts/company_alias.py'
      - 'scripts/test_company_alias.py'
      # A reformat of these data files is what silently emptied the SEEK and
      # Zhaopin rosters, so a change to either has to re-run the parsers.
      - 'src/employsi/data/seekAdvertisers.ts'
      - 'src/employsi/data/chinaJobsTargets.ts'
      # The APS agency list, for the same reason: its loader read this file with
      # a regex and lost the 7 entries that carry a hub override when Prettier
      # normalised the quotes. scripts/aps-roster.ts is now what reads it.
      - 'src/employsi/data/canberraGov.ts'
      - 'scripts/aps-roster.ts'
      - '.github/workflows/scraper-check.yml'
  pull_request:
    paths:
      - 'scripts/jobs_extract.py'
      - 'scripts/oxylabs_client.py'
      - 'scripts/http_fetch.py'
      - 'scripts/*-to-d1.py'
      - 'src/employsi/data/seekAdvertisers.ts'
      - 'src/employsi/data/chinaJobsTargets.ts'
      - 'src/employsi/data/canberraGov.ts'
      - 'scripts/aps-roster.ts'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # test_rosters.py exercises seek-to-d1.py's advertiser loader, which reads
      # the map by running scripts/seek-advertisers.ts rather than regexing the
      # source (a company's advertisers are composed at runtime, so there is no
      # literal to match). Without bun that check would fail here for the wrong
      # reason — and the real seek-archive run already depends on bun anyway.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Job-extraction parser tests
        run: python scripts/test_jobs_extract.py

      - name: Roster parsers still read their data files
        run: python scripts/test_rosters.py

      # A Bright Data snapshot reports `ready` before it is servable, and a
      # download that gives up on the first empty answer throws away a
      # collection that has already been paid for — then reports it as a
      # collection failure, which sends the next person bisecting the roster
      # for a company that is fine. Measured 2026-09-21: 10,117 records lost
      # that way, recovered by hand the next day.
      - name: Bright Data download retries an unserved snapshot
        run: python scripts/test_brightdata_download.py

      # NSW discovery has two failure modes needing opposite responses — a
      # Cloudflare block (retry with a fresh session) and the credentials moving
      # in the bundle (stop, no retry helps). Conflating them cost the feed two
      # days on 2026-09-21: one blocked chunk fetch exited from inside the retry
      # loop and reported the site as rebuilt. Neither outcome is visible in the
      # rows, so the only thing distinguishing them is a message.
      - name: NSW discovery tells a block apart from a contract change
        run: python scripts/test_nsw_discovery.py

      # A company-scoped board search returns the employer we asked for, a
      # different employer with a similar name, and rows with no employer at
      # all — and indeed-to-d1.py stamps company_id from the company being
      # WALKED, not from the row. So a gate that is too loose files Palo Alto
      # Networks' vacancies as Alto's hiring, and one that is too strict
      # silently drops Reece, PwC, Mater and Macmahon (100, 100, 100 and 91 rows
      # in the 2026-09-16 measurement). Neither shows up in the app: the card
      # renders a plausible number either way. Same reason check-skill-trends.ts
      # exists.
      - name: Employer attribution gate holds its measured pairs
        run: python scripts/test_company_alias.py

      # A company added to the roster appears on the map immediately, whether or
      # not any job board is searched for it — so without this, a new employer
      # can sit there showing zero open roles and read as one that is not
      # hiring. Fails on any rostered company with no keyword-feed target.
      - name: Every rostered company reaches the keyword feeds
        run: python scripts/check-feed-coverage.py

      - name: Byte-compile the scrapers
        run: python -m compileall -q scripts/*.py
