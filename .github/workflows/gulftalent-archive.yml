# Daily GulfTalent (Dubai) → D1 archive, in real Chrome through a residential
# exit (SCRAPE_PROXY / IPRoyal).
#
# GulfTalent's JSON jobs API refuses a datacentre address, and refuses an
# automated-looking browser from a residential one too. The second half is what
# used to be bought rather than built.
#
# WHAT MAKES THIS WORK WITHOUT A PAID UNBLOCKER. Measured 2026-08-09
# (probe-headless-ci.py --fingerprint), through the SAME IPRoyal exit address,
# the two profiles minutes apart:
#
#   chromium-headless-shell                          403 Akamai deny, ~330 bytes
#   real Chrome, headful under Xvfb, stealth patches 200, rows
#
# Reproduced on two separately pinned sticky sessions, with a control board
# returning 21 rows under BOTH profiles in the confirming run — so the exit was
# healthy for the baseline too and this is not a luckier IP. Akamai was
# fingerprinting the BROWSER BUILD: chromium-headless-shell is a stripped binary
# that is not Chrome (no proprietary codecs, SwiftShader WebGL strings, no
# chrome.runtime). The address was never the thing being refused, which is what
# Oxylabs had been paid for here.
#
# The BROWSER_FETCH_* env vars below are load-bearing. Without them the run gets
# the 403 and reports the board as blocked.#
#
# The board's JSON endpoint sits behind Akamai, which returns 403 to a
# datacentre IP, so requests go through Oxylabs for the residential IP. No JS
# rendering is needed.
#
# The endpoint's own city/country parameters are accepted and ignored — a
# request pinned to Dubai still returns Riyadh and Doha roles — so the scraper
# filters on each row's stated location instead. That makes the walk wider than
# the kept set: expect roughly a third of each page to be Dubai.
#
# Rows are archived board-wide (company_id null) because these are market
# listings rather than a tracked employer's, so they feed the Dubai hub view
# without being attributed to a company we have not matched.
#
# Required repo secrets:
#   SCRAPE_PROXY                        — residential exit, http://user:pass@host:port
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Use "Run workflow" to verify before relying on the schedule.

name: gulftalent-archive

on:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC daily
  workflow_dispatch: {}

concurrency:
  group: gulftalent-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright, real Chrome and Xvfb
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m playwright install --with-deps chrome
          sudo apt-get install -y xvfb
      - name: Scrape GulfTalent (Dubai) → D1 (real Chrome via SCRAPE_PROXY)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          # THE FINGERPRINT IS THE POINT. Measured 2026-08-09: this board answers
          # chromium-headless-shell with a 403 Akamai deny and real Chrome with
          # rows, from the SAME exit address. Without these two the run gets the
          # 403 and reports the board as blocked.
          BROWSER_FETCH_CHANNEL: chrome
          BROWSER_FETCH_STEALTH: '1'
          BROWSER_FETCH_HEADFUL: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. This board refuses a datacentre"
            echo "address regardless of browser, so the run would only collect 403s."
            exit 1
          fi
          xvfb-run -a python scripts/gulftalent-to-d1.py --max-pages 40
