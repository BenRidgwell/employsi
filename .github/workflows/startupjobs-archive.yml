# Daily startup.jobs → D1 archive, one company page per rostered employer.
#
# startup.jobs 403s a datacentre IP, so the company pages run here rather than in
# the jobs-cron Worker, through a residential exit (SCRAPE_PROXY / IPRoyal). The
# 42,885-company slug directory comes straight off the board's CDN sitemap,
# which answers a plain request and is left on the direct path.
#
# Measured 2026-08-09 from a GitHub runner (probe-headless-ci.py, reproduced on
# a second run): headless Chromium through that exit loaded /company/twitch and
# counted 20 cards with the scraper's own CARD marker. Plain urllib through the
# same exit did not, so the browser is the challenge-clearer here, not the
# renderer — the pages are server-rendered and need no JS. Each page after the
# first is a fetch() from inside the cleared page, which returns the server's
# own bytes; the CARD regex matches adjacent attributes and a serialised DOM
# reorders them.
#
# Attribution is by an explicit CONFIRMED list in the script, not by name match:
# on this board /company/igo is "iGo" of Pennsylvania and /company/redox is a US
# healthcare API firm, neither of which is the ASX company of that name. Slug
# matches that are advertising but unconfirmed are printed at the end of the run
# with their evidence, and nothing is written for them.
#
# Required repo secrets:
#   SCRAPE_PROXY                        — residential exit, http://user:pass@host:port
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Pass --oxylabs (with OXYLABS_USERNAME / OXYLABS_PASSWORD restored to the env
# below) to put the Web Scraper API back if IPRoyal stops getting through.
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero if the sitemap is unreachable or if not one confirmed
# employer returns a role — either is the board blocking us, not a quiet market.

name: startupjobs-archive

on:
  schedule:
    - cron: '50 18 * * *' # 18:50 UTC daily (~05:50 AEST), after simplyhired
  workflow_dispatch: {}

concurrency:
  group: startupjobs-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape startup.jobs → D1 (browser via SCRAPE_PROXY)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. startup.jobs 403s a datacentre address,"
            echo "so the company pages would only return challenges."
            exit 1
          fi
          python scripts/startupjobs-to-d1.py
