# Daily Whitehaven Coal (Dayforce) → D1 archive (hosted, (rendered, local browser)).
#
# Whitehaven advertises on two boards. The SuccessFactors one
# (careers.whitehavencoal.com.au, its Queensland roles) is read in-process by the
# jobs-cron Worker as `sydney-whc-sf`. This is the other: the Dayforce candidate
# portal carrying the New South Wales operations.
#
# It cannot run in the Worker. The portal renders client-side and its search API
# (POST /api/geo/whitehavencoal/jobposting/search) returns a bare 403 behind
# Cloudflare for any datacentre IP — with browser headers, with an Origin and
# Referer, and with the portal's own session cookies. A Cloudflare Worker would
# fare worse, not better. So the page is rendered through a residential IP.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero when the portal yields no job cards: Whitehaven runs six
# mines across two states, so zero means the render did not settle.

name: whitehaven-dayforce

on:
  schedule:
    - cron: '20 18 * * *' # 18:20 UTC daily (~05:20 AEST)
  workflow_dispatch: {}

concurrency:
  group: whitehaven-dayforce
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright drives the render locally now — the proxy was only ever
      # supplying a browser for this board, not a residential IP.
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Whitehaven Dayforce portal → D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/whitehaven-dayforce-to-d1.py
