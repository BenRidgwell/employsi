# Daily NSW Government → D1 archive (hosted, via the Oxylabs Web Scraper API).
#
# iworkfor.nsw.gov.au sits behind Cloudflare's "Just a moment" interstitial, which
# persistently challenges datacenter IPs — a headless Chromium on a GitHub runner
# never clears it (the first attempt rendered 0 rows for exactly this reason). So
# instead of a browser this fetches the board's rendered HTML through the Oxylabs
# Web Scraper API (residential IP + Cloudflare challenge + JS render solved
# server-side) and parses it — no Playwright, so it runs on an ordinary runner.
# Same hosted pattern as the Indeed archive.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + notification) if the board renders no rows.
# Use "Run workflow" (workflow_dispatch) to verify it on the runner first.

name: nsw-gov-archive

on:
  schedule:
    - cron: '30 17 * * *' # 17:30 UTC daily (~04:30 AEST) — before the SEEK run
  workflow_dispatch: {}

concurrency:
  group: nsw-gov-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scrape NSW gov → D1 (Oxylabs)
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/nsw-gov-to-d1.py --max-pages 60
