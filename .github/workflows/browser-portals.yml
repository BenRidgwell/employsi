# Daily Stockland + Auckland Airport + TechnologyOne + ECU careers boards → D1
# archive (rendered, local browser).
#
# Both are employer portals the jobs-cron Worker cannot run, for two different
# reasons — which is worth keeping straight, because the fix differs:
#
#   Stockland (career10.successfactors.com) is REACHABLE but not READABLE. It
#   runs the old SuccessFactors RCM career portal, which server-renders no jobs
#   at all and fetches its results over DWR. It needs a real browser, and its
#   paginator is click-only, so the script renders and clicks "Next".
#
#   Auckland Airport (careers.aucklandairport.co.nz) and TechnologyOne
#   (technology1.com) are READABLE but not REACHABLE. Their HTML carries every
#   role with no JavaScript needed — verified identical rendered and not — but a
#   plain datacentre request gets HTTP 403 and a Cloudflare challenge page.
#
#   Edith Cowan (ecu.nga.net.au) is the same shape with a different doorman:
#   NGA.NET answers a plain request with HTTP 405 and a 2.1 KB "Human
#   Verification" page. Measured 2026-08-17, and re-measured with HTTP_PROXY
#   unset to rule out the authoring sandbox's own proxy — same result, so the
#   405 is NGA.NET's bot check rather than the network in front of it.
#
#   That challenge is at the HTTP layer, not the address. A REAL BROWSER on the
#   same datacentre address clears it: measured twice from a hosted runner
#   (probe-headless-ci, 2026-08-08) at 56 tiles and 37 rows both times. So both
#   moved off Oxylabs on 2026-08-08 and now render locally like Stockland. The
#   browser is there only to satisfy the challenge — the jobs still need no
#   JavaScript — and `--oxylabs` puts the proxy back on either.
#
# Rows land as `portal-sf`/`sydney-sgp` and `portal-wpjb`/
# `nz-auckland-international-airport`, through the same key and upsert as every
# other portal, so a role already held from Adzuna, SEEK or Jora refreshes
# rather than duplicating.
#
# Each script exits non-zero when it parses nothing, so a block or a markup
# change fails the run loudly rather than leaving a card reading zero. The two
# steps are independent: Stockland failing must not stop Auckland Airport
# writing, so the second step runs even if the first fails, and the job's own
# status still reflects either failing.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Use "Run workflow" to verify before relying on the schedule.

name: browser-portals

on:
  schedule:
    # 04:45 UTC daily — in the gap between the Worker's portal ticks (which run
    # from 04:20 through 08:15) and clear of the NAB portal run at 04:40.
    - cron: '45 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: browser-portals
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # bun runs scripts/map-skills.ts, so these roles carry exactly the skills
      # the same title would get from any other source.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright, for all three scrapers in this file. Auckland Airport and
      # TechnologyOne joined Stockland on 2026-08-08, so no step here needs the
      # proxy any more and the workflow carries no Oxylabs credentials at all.
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Stockland careers → D1 (rendered, local browser)
        id: stockland
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/stockland-to-d1.py

      - name: Scrape Auckland Airport careers → D1 (rendered, local browser)
        # Runs even if Stockland failed — they are unrelated boards, and one
        # being blocked is no reason to skip archiving the other.
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/aucklandairport-to-d1.py

      - name: Scrape TechnologyOne careers → D1 (rendered, local browser)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/technologyone-to-d1.py

      - name: Scrape Edith Cowan University careers → D1 (rendered, local browser)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/ecu-to-d1.py
