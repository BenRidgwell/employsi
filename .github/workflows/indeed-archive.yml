# Daily Indeed → D1 archive (hosted runner, headless Chromium + a residential
# exit).
#
# Indeed refuses a datacentre ADDRESS — a plain request from a runner gets 403
# and a Cloudflare interstitial, and a browser on that same address gets the
# same thing (measured 2026-08-06). So the address has to change, and the
# question was only which residential exit.
#
# Measured 2026-08-09 from a GitHub runner (probe-headless-ci.py, reproduced on
# a second run): headless Chromium egressing through IPRoyal loaded a live
# au.indeed.com company search and indeed_company_scraper.parse_search_html
# counted 16 rows. Plain urllib through the same exit got nothing — the browser
# is not optional here even with the right address.
#
# The walk is single-threaded (Playwright's sync API is), but each search page
# after the first is a fetch() from inside the cleared page rather than a
# navigation, so it runs at plain-HTTP speed.
#
# Required repo secrets:
#   SCRAPE_PROXY          — residential exit, http://user:pass@host:port
#   CLOUDFLARE_API_TOKEN  — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Pass --oxylabs (with OXYLABS_USERNAME / OXYLABS_PASSWORD restored to the env
# below) to put the Web Scraper API back if IPRoyal stops getting through.
#
# Exits non-zero (red X) if Indeed starts returning nothing. Use "Run workflow"
# to verify before relying on the schedule.

name: indeed-archive

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC daily
  workflow_dispatch:
    inputs:
      proxy_session:
        description: 'Sticky IPRoyal session id (empty = the rotating pool)'
        type: string
        default: ''
      proxy_lifetime:
        description: 'How long that session holds its address'
        type: string
        default: '30m'
      limit:
        description: 'Companies to walk (blank = the whole roster)'
        type: string
        default: ''

concurrency:
  group: indeed-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # The Oxylabs path needed 350 and used nearly all of it, but most of that
    # was its own 613 backoffs (~1.4 per company) rather than the fetches. This
    # path has no backoffs and no concurrency; 300 is kept deliberately generous
    # until a full run has been timed, because a job cancelled at the cap writes
    # what it wrote and reports nothing about what it never reached — a run 91%
    # done looks exactly like one that died early.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Indeed → D1 (browser via SCRAPE_PROXY)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          # WHY A STICKY EXIT IS WORTH TRYING HERE. Measured 2026-08-09: every
          # company in the walk came back as a 432 KB page carrying a captcha
          # challenge, on both browser builds tried. DataDome binds its
          # clearance to the cookie AND the address. nav_get holds one browser
          # session so the cookie persists, but the rotating pool hands out a
          # new address per request — so the browser presents clearance earned
          # by one IP while arriving from another, which is indistinguishable
          # from stolen clearance. A single probe request never meets that; a
          # 354-company walk meets it every time.
          #
          # Left EMPTY by default, so the scheduled run keeps the configuration
          # that was measured until a dispatch proves a better one.
          SCRAPE_PROXY_SESSION: ${{ inputs.proxy_session }}
          SCRAPE_PROXY_LIFETIME: ${{ inputs.proxy_lifetime }}
          # NO FINGERPRINT SWITCHES HERE, DELIBERATELY. They were added on
          # 2026-08-09 as "insurance" in the same commit that fixed the
          # transport, and the first run walked 25 companies for zero listings.
          # Two changes at once on the feed that matters most, which is the
          # confound this repo keeps catching elsewhere.
          #
          # What probe-headless-ci measured for Indeed was chromium-headless-
          # shell through this exit, parse_search_html, 16 rows. This is that
          # configuration and nothing more. If the fingerprint turns out to help
          # here it can be added on its own, measured on its own.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # The whole roster; up to 20 pages each (the walk stops early once a
        # company yields no new ads, so small employers cost little).
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. Indeed 403s a datacentre address, so"
            echo "this would spend the whole run collecting interstitials."
            exit 1
          fi
          python scripts/indeed-to-d1.py --max-pages 20 \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
