# Indeed → D1 archive through the Oxylabs Web Scraper API. NO LONGER SCHEDULED —
# dispatch-only since 2026-08-29; brightdata-archive.yml collects Indeed now.
#
# IT WAS MOVED OFF OXYLABS ON 2026-08-09 AND MOVED BACK THE SAME DAY. The
# evidence for the move was one probe request: headless Chromium through the
# IPRoyal exit loaded a live au.indeed.com search and parse_search_html counted
# 16 rows, reproduced. That is true and it does not survive a walk. Three
# configurations were then tried against the real roster:
#
#   headless-shell, rotating exit    every company: captcha challenge
#   real Chrome + stealth, rotating  every company: captcha challenge
#   headless-shell, sticky exit      every company: captcha challenge
#
# The pages arrive — 432-442 KB of real Indeed — and carry a DataDome challenge
# instead of results. So it is not the address (a pinned exit failed the same
# way), not the browser build (both failed the same way), and not the markup.
# What DataDome refuses is the SUSTAINED WALK, which no single probe request can
# reveal. ARCHIVE.md already recorded the general form of this after the Jora
# work: a single request proves nothing for a feed that walks 355 companies.
#
# Indeed therefore needs an unblocker rather than an address, which is what
# Oxylabs sells it. Bright Data has an Indeed scraper on the same per-record API
# as scripts/brightdata-to-d1.py if that bill is ever worth comparing.
#
# `scripts/indeed-to-d1.py` keeps all three transports — drop --oxylabs to use
# the browser, add --nav for the warmed-browser walk — so re-testing costs a
# dispatch rather than a rewrite.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Exits non-zero if Indeed returns nothing — including on a short walk, which
# used to slip past the DEAD_AFTER abort and report success on zero rows.
name: indeed-archive

on:
  # SCHEDULE REMOVED 2026-08-29 — INDEED IS COLLECTED BY brightdata-archive.yml
  # NOW, which is what the note at the top of this file anticipated when it said
  # Bright Data "has an Indeed scraper on the same per-record API ... if that
  # bill is ever worth comparing". It was, and the comparison has been made.
  #
  # The dispatch inputs below are kept deliberately. This file holds all three
  # transports and the measurements that ruled two of them out, so re-testing
  # DataDome after it changes should cost a dispatch rather than a rewrite.
  #
  # It was '0 20 * * *'. Leaving it on cost 8 red runs in the week to 2026-08-28,
  # every one of them ending
  #
  #     oxylabs auth failed (401) — check OXYLABS_USERNAME/PASSWORD
  #
  # which is the account being rejected rather than the plan quota running out —
  # that is a 429, and it is what happened on 2026-08-09. The credentials 401
  # when tested directly too, so this is not a stale repo secret.
  workflow_dispatch:
    inputs:
      proxy_session:
        description: 'Sticky IPRoyal session id (empty = the rotating pool)'
        type: string
        default: ''
      proxy_lifetime:
        description: 'How long that session holds its address'
        type: string
        default: '30m'
      limit:
        description: 'Companies to walk (blank = the whole roster)'
        type: string
        default: ''

concurrency:
  group: indeed-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # The Oxylabs path needed 350 and used nearly all of it, but most of that
    # was its own 613 backoffs (~1.4 per company) rather than the fetches. This
    # path has no backoffs and no concurrency; 300 is kept deliberately generous
    # until a full run has been timed, because a job cancelled at the cap writes
    # what it wrote and reports nothing about what it never reached — a run 91%
    # done looks exactly like one that died early.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Indeed → D1 (browser via SCRAPE_PROXY)
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          # Kept so a dispatch can re-test the browser path without editing this
          # file: clear the oxylabs flag in the run line below and it takes over.
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          # WHY A STICKY EXIT IS WORTH TRYING HERE. Measured 2026-08-09: every
          # company in the walk came back as a 432 KB page carrying a captcha
          # challenge, on both browser builds tried. DataDome binds its
          # clearance to the cookie AND the address. nav_get holds one browser
          # session so the cookie persists, but the rotating pool hands out a
          # new address per request — so the browser presents clearance earned
          # by one IP while arriving from another, which is indistinguishable
          # from stolen clearance. A single probe request never meets that; a
          # 354-company walk meets it every time.
          #
          # Left EMPTY by default, so the scheduled run keeps the configuration
          # that was measured until a dispatch proves a better one.
          SCRAPE_PROXY_SESSION: ${{ inputs.proxy_session }}
          SCRAPE_PROXY_LIFETIME: ${{ inputs.proxy_lifetime }}
          # NO FINGERPRINT SWITCHES HERE, DELIBERATELY. They were added on
          # 2026-08-09 as "insurance" in the same commit that fixed the
          # transport, and the first run walked 25 companies for zero listings.
          # Two changes at once on the feed that matters most, which is the
          # confound this repo keeps catching elsewhere.
          #
          # What probe-headless-ci measured for Indeed was chromium-headless-
          # shell through this exit, parse_search_html, 16 rows. This is that
          # configuration and nothing more. If the fingerprint turns out to help
          # here it can be added on its own, measured on its own.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # The whole roster; up to 20 pages each (the walk stops early once a
        # company yields no new ads, so small employers cost little).
        run: |
          if [ -z "$OXYLABS_USERNAME" ]; then
            echo "OXYLABS_USERNAME is not set. Indeed's DataDome answers every"
            echo "other transport measured so far with a captcha challenge, so"
            echo "this would spend the whole run collecting them."
            exit 1
          fi
          python scripts/indeed-to-d1.py --oxylabs --max-pages 20 --concurrency 8 \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
