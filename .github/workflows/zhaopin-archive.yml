# Daily Zhaopin (智联招聘) → D1 archive.
#
# THE SCHEDULED FEED HAS COLLECTED NOTHING SINCE 2026-08-28. Every run ends
#
#     oxylabs auth failed (401) — check OXYLABS_USERNAME/PASSWORD
#
# on all 93 companies — six consecutive red scheduled runs to 2026-09-29. That
# is the ACCOUNT being rejected, not the plan quota (which is a 429), and the
# same credential took Indeed down the same day. The run going red is the guard
# working; it has simply been red for a month.
#
# `transport: cffi` IS WHAT THE SCHEDULE NOW RUNS, proven from a hosted runner
# on 2026-09-29 (6 of 6 companies, 94 listings, 42s, no challenge). It borrows
# the technique in jiangyuxue666/job-market-
# analyzer (MIT): curl_cffi presenting Chrome's TLS fingerprint
# (`impersonate=chrome131`), no browser and no paid unblocker. Zhaopin's wall
# reads the TLS ClientHello, so a stock Python client is refused before it sends
# a header.
#
# THE FINGERPRINT ALONE IS NOT ENOUGH, which is the measurement that shapes this
# workflow. From CI's address class on 2026-09-29, with the impersonation
# confirmed live (JA3 varies per profile, so the spoofed hello does reach the
# far end):
#
#   sou.zhaopin.com / www.zhaopin.com   "Security Verification", 1,930 bytes
#   fe-api /search/positions (POST)     HTTP 200, isVerification=1, 0 results
#   fe-api /c/i/sou (legacy GET)        HTTP 200, numTotal=0 on every variant
#   fe-api /city-page/user-city         HTTP 200, REAL DATA
#
# The last line rules out a blanket ban on the address — the host answers, it
# just will not serve job results. The upstream tool carries no proxy because
# it is a domestic Chinese tool: from inside China the fingerprint is the only
# wall. So this pairs it with SCRAPE_PROXY_COUNTRY=cn.
#
# THE POOL DOES HAVE CHINESE ADDRESSES — that was the open question and the
# 2026-09-29 run answered it. The walk still counts companies that get the
# interstitial and reports them as CHALLENGED rather than as employers with no
# vacancies, because the day the exit stops working is the day that distinction
# decides whether you go looking at the proxy or at the roster.
#
# THE PARSER QUESTION IS SETTLED TOO. This shipped with two readings of the page
# because nobody could load one; the run reported `__INITIAL_STATE__×13` and the
# card reading matched nothing, so the JSON parser is the live one and the
# ported CSS-selector reading has been removed. The existing parser was never
# wrong — it only ever looked wrong because the unblocker under it had died.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Exits non-zero (red X) if Zhaopin returns nothing. Use "Run workflow" to verify
# before relying on the schedule.

name: zhaopin-archive

on:
  # THE SCHEDULE RUNS `cffi` FROM 2026-09-29. It ran the Oxylabs path until
  # then and went red nightly for a month; the replacement is now proven from a
  # hosted runner, so the nightly run uses it.
  #
  # What earned the switch, measured 2026-09-29 through SCRAPE_PROXY_COUNTRY=cn:
  # a 6-company solve returned 94 listings from 6 of 6 companies in 42s, no
  # challenge anywhere. That also answered the question this file could not:
  # IPRoyal's pool DOES resolve _country-cn to an address Zhaopin serves.
  schedule:
    - cron: '30 20 * * *' # 20:30 UTC daily — staggered after Indeed
  workflow_dispatch:
    inputs:
      transport:
        description: 'cffi = curl_cffi TLS impersonation via SCRAPE_PROXY (needs a cn exit); oxylabs = the Web Scraper API (401 since 2026-08-28)'
        type: choice
        options: [cffi, oxylabs]
        default: cffi
      proxy_country:
        description: 'SCRAPE_PROXY exit country. cn is what Zhaopin wants; blank uses the pool default'
        type: string
        default: 'cn'
      impersonate:
        description: 'curl_cffi browser profile (the fingerprint IS the mechanism)'
        type: string
        default: 'chrome131'
      limit:
        description: 'Companies to walk (blank = all)'
        type: string
        default: ''
      solve:
        description: 'Reachability only — print reachable/CHALLENGED per company, write nothing to D1'
        type: boolean
        default: false

concurrency:
  group: zhaopin-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # curl_cffi carries its own libcurl-impersonate build. Unpinned
      # deliberately — the TLS profiles ship in the package, so when Chrome
      # moves, a fresh release is the fix and a pin is the thing that breaks.
      - name: Install curl_cffi
        # DEFAULTS TO cffi, matching the run step below. A scheduled fire gets
        # no `inputs`, so if this fallback said 'oxylabs' the nightly run would
        # skip the install and then try to import curl_cffi — a green install
        # step and an immediate failure, which is a worse signal than either.
        if: ${{ (inputs.transport || 'cffi') == 'cffi' }}
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Scrape Zhaopin → D1
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          # A CHINESE BOARD WANTS A CHINESE ADDRESS. http_fetch folds this onto
          # the IPRoyal password as _country-cn; the script warns loudly if it
          # is anything else, because the fingerprint alone was measured
          # insufficient and a run without this reads as "Zhaopin is empty".
          SCRAPE_PROXY_COUNTRY: ${{ inputs.proxy_country || 'cn' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # All ~94 roster companies; up to 8 pages each (early-stop on no new ads).
        #
        # A SCHEDULED FIRE GETS NO `inputs` — a workflow_dispatch default does
        # not apply to a cron run — so the fallback below is what the nightly
        # run actually reads. Changing it is what moves the schedule; the
        # `default:` on the input above only affects the dispatch form.
        run: |
          TRANSPORT="${{ inputs.transport || 'cffi' }}"
          if [ "$TRANSPORT" = "cffi" ]; then
            if [ -z "$SCRAPE_PROXY" ]; then
              echo "SCRAPE_PROXY is not set. Measured 2026-09-29: the runner's own"
              echo "address gets a Security Verification page rather than results,"
              echo "so this would only collect challenges."
              exit 1
            fi
            python scripts/zhaopin-to-d1.py --cffi --max-pages 8 --concurrency 4 \
              --impersonate '${{ inputs.impersonate || 'chrome131' }}' \
              ${{ inputs.solve && '--solve' || '' }} \
              ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
            exit $?
          fi
          python scripts/zhaopin-to-d1.py --max-pages 8 --concurrency 8 \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
