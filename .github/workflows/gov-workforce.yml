# Queensland public-sector workforce data, fetched from a GitHub runner.
#
# WHY THIS EXISTS AT ALL. Every other jurisdiction's workforce data is pulled
# by scripts/gen-gov-workforce.py from a developer machine. Queensland cannot
# be: the current State of the Sector workbooks are on www.data.qld.gov.au,
# which answers `x-amzn-waf-action: challenge` and returns a JavaScript
# interstitial instead of the file. The CKAN datastore only serves as far as
# March 2023, and the older profiles on forgov.qld.gov.au download fine — so it
# is that one host rather than the jurisdiction.
#
# This is the same reasoning behind the SEEK and Indeed workflows: a source
# that refuses one network is fetched from another. See workers/jobs-cron/
# ARCHIVE.md for the general case.
#
# MEASURED 2026-09-24: a plain runner gets the SAME challenge the sandbox does,
# 2,027 bytes of `window.awsWafCoo…`, so this was never an IP block and moving
# the fetch alone achieved nothing. The challenge has to be executed, so the
# job drives a real browser — the same answer browser-portals.yml reached for
# NGA.NET's heavier `captcha` action.
#
# WHAT IT DOES: runs scripts/gen-gov-workforce.py with a browser available, so
# Queensland loads alongside APS and Victoria, then prints the generated data
# file to the job log and uploads it as an artifact.
#
# SOUTH AUSTRALIA IS HERE TOO, though no longer because it has to be. Its
# Workforce Information Report is a PDF and nothing else — every edition from
# 2012 to 2025 — so it needs pdfplumber, which this repo recorded as unusable
# in the authoring sandbox because its cryptography binding panics there.
#
# THAT PANIC IS A MISSING PACKAGE, NOT A BROKEN SANDBOX. Measured 2026-09-25:
# the import fails on `ModuleNotFoundError: No module named '_cffi_backend'`
# several frames beneath a pyo3 PanicException, and `pip install cffi` fixes
# it outright — pdfplumber and pypdf both import and read a 64-page PDF
# immediately afterwards. The panic is loud and unhelpful enough that it read
# as an environment that could not run the library at all, and three
# jurisdictions were routed through this workflow partly on that basis.
#
# South Australia stays here regardless, because a scheduled refresh belongs on
# a runner. But a PDF can now be opened where the parser is being written,
# which is where it is most useful: Queensland cost twelve wrong rows out of
# twenty-eight, and the Northern Territory took six round trips through CI to
# learn its table had three columns and not five.
#
# VICTORIA IS NOT FETCHED HERE and that is not an oversight: vpsc.vic.gov.au
# answers HTTP 403 to this runner, through a browser as well as plainly. The
# generator merges, so running Queensland alone keeps Victoria's rows and says
# so in the file's header.
#
# IT DOES NOT COMMIT. No workflow in this repo pushes to a branch and this is
# not the one to start with — the repo syncs to Lovable and its history is not
# something a scheduled job should touch. The generated file is picked up from
# the artifact and committed by a person.
#
# QUEENSLAND PUBLISHES FTE, NOT HEADCOUNT. Every agency figure in the workbook
# is a full-time equivalent; the single head count in all seventeen sheets is a
# tenure distribution with no agency breakdown. The rows are marked `fte` and
# the card labels those tiles "Workforce FTE" rather than putting two different
# measurements under one word.

name: gov-workforce

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/qld-workforce-probe.py'
      - 'scripts/gen-gov-workforce.py'
      - 'scripts/gov-source-probe.py'
      - 'scripts/sa-workforce-probe.py'
      - '.github/workflows/gov-workforce.yml'

concurrency:
  group: gov-workforce
  cancel-in-progress: true

jobs:
  generate:
    name: gov workforce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Playwright, because the doorman is an AWS WAF JavaScript challenge
      # rather than an IP block — a plain runner gets the same interstitial the
      # authoring sandbox does. Same approach as browser-portals.yml.
      - name: Install Playwright + openpyxl
        run: |
          python -m pip install --upgrade pip
          pip install --quiet playwright openpyxl pdfplumber
          python -m playwright install --with-deps chromium

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --only qld,sa,nsw,nz, because the jurisdictions need OPPOSITE
      # environments and no machine can fetch them all. Measured 2026-09-24:
      # Queensland needs a browser and runs only here; Victoria answers HTTP
      # 403 to a datacentre IP — through a browser too, 13 KB of HTML — and
      # runs only from a developer machine. The generator merges rather than
      # rewrites, so this refreshes what it loads and leaves the others exactly
      # as they were, and the file's header records which is which.
      #
      # New Zealand needs neither a browser nor this runner — Te Kawa Mataaho
      # serves two plain CSVs — and is here so a scheduled run refreshes it
      # with the rest. It was recorded as having no source at all until
      # 2026-09-24; what is actually blocked is catalogue.data.govt.nz, whose
      # CKAN API answers with an Imperva interstitial, and the agency's own
      # site was never tried. See load_nz.
      # NT and TAS join here because both sit behind a Cloudflare challenge
      # that only a WARMED browser clears — the origin is visited first, once
      # per context, and the clearance cookie makes the rest cheap. Neither is
      # reachable from a developer machine without that.
      # Output is captured as well as shown, because stderr carries the whole
      # diagnosis — which roster agency matched nothing and which source rows
      # matched nothing back — and the last step reprints it. See that step
      # for why. `2>&1 | tee` rather than a process substitution: the latter
      # can still be flushing when the step ends, and a diagnosis that is
      # sometimes empty is worse than no diagnosis at all. pipefail keeps the
      # generator's exit status.
      - name: Generate QLD + SA + NSW + NZ + NT + TAS workforce data
        run: |
          set -o pipefail
          python scripts/gen-gov-workforce.py --only qld,sa,nsw,nz,nt,tas \
            2>&1 | tee /tmp/gov-diagnosis.txt

      - name: Show the generated file
        run: |
          echo "--- src/employsi/data/govWorkforceAu.ts ---"
          cat src/employsi/data/govWorkforceAu.ts

      - uses: actions/upload-artifact@v4
        with:
          name: govWorkforceAu
          path: src/employsi/data/govWorkforceAu.ts
          retention-days: 14

      # The probe stays runnable by hand: it reports the workbook's structure,
      # which is what a parser has to be rewritten against when the State of
      # the Sector format next changes.
      - name: Probe (structure only, never fails the job)
        if: always()
        continue-on-error: true
        run: python scripts/qld-workforce-probe.py

      # Reconnaissance for the jurisdictions that are not wired yet. They
      # answer 403 to the authoring sandbox on every candidate host, so
      # nothing about them — whether the data exists, what shape it is in,
      # whether the 403 is a datacentre block — can be established from there.
      # Never fails the job: it reports, it does not gate.
      - name: Probe unwired jurisdictions (SA, NT, TAS)
        if: always()
        continue-on-error: true
        run: python scripts/gov-source-probe.py

      # South Australia publishes its Workforce Information Report as a PDF and
      # nothing else — every year from 2012 to 2025. PDF table extraction is
      # brittle and annual, so this establishes whether the per-agency table is
      # even in there before anything is built on it.
      - name: Probe the SA Workforce Information Report
        if: always()
        continue-on-error: true
        run: python scripts/sa-workforce-probe.py

      # New South Wales publishes no downloadable workforce profile any more —
      # the PSC page carries none even rendered. Its Local Health Districts
      # carry two thirds of the jurisdiction's live ads, and a health annual
      # report's appendix is where staff numbers by organisation usually sit.
      - name: Probe the NSW Health annual report appendix
        if: always()
        continue-on-error: true
        run: |
          python scripts/sa-workforce-probe.py \
            https://www.health.nsw.gov.au/annualreport/Publications/2025/appendix.pdf
          python scripts/sa-workforce-probe.py \
            https://www.health.nsw.gov.au/annualreport/Publications/2025/appendix.pdf

      # THE DIAGNOSIS IS REPRINTED LAST, AND THAT IS THE POINT. It is produced
      # by the FIRST step, and everything after it — the whole generated data
      # file, three probes and a 59-page PDF dump — buries it about two
      # thousand lines deep. The two lists it holds (roster agencies with no
      # figure, and source rows that matched nothing) are the entire working
      # material for an ALIAS entry: Victoria's gap closed from 38 cards to 20
      # by reading exactly these two lists, with no new source involved.
      #
      # Printing it again at the end costs nothing and puts it where a log tail
      # can reach it.
      - name: Diagnosis (reprinted last so the log tail reaches it)
        if: always()
        run: |
          echo "=== unmatched roster agencies, and unmatched source rows ==="
          sed -n '/roster agencies WITHOUT/,$p' /tmp/gov-diagnosis.txt || true
          {
            echo '## gov-workforce diagnosis'
            echo
            echo '```'
            sed -n '/roster agencies WITHOUT/,$p' /tmp/gov-diagnosis.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
