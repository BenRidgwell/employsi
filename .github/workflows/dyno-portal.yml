# Daily Dyno Nobel → D1 archive (hosted, via the Oxylabs Web Scraper API).
#
# Dyno Nobel advertises on two boards and this reads both.
#
# The Australian one is the OLD SuccessFactors RCM career portal
# (career4.successfactors.com/career?company=IncitecPivot). It server-renders no
# job rows at all and fetches its results over DWR after load, so a Cloudflare
# Worker cannot read it — the same reason Sandfire and Stockland run here.
#
# The Americas one is Taleo Business Edition. The URL the AU site links to is
# dead (that whole Taleo pod answers "undergoing maintenance" for every org,
# invented ones included); the live board is on phh.tbe.taleo.net with a
# different career-site number. It needs no render, but it does need a SESSION:
# the search is a POST and the next-page link carries only a row offset, so
# fetching it without the search's cookie returns a 1-byte body. That statefulness
# is what keeps it out of the Worker, whose fetch helper is stateless by design.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + notification) when either board returns no job
# rows, because a 3,000-person explosives manufacturer with operations across
# Australia and the Americas does not stop advertising — zero means the render
# did not settle or a board moved again. A dead Americas board does NOT discard
# the Australian rows already read; the run just goes red.

name: dyno-portal

on:
  schedule:
    - cron: '10 18 * * *' # 18:10 UTC daily (~05:10 AEST)
  workflow_dispatch: {}

concurrency:
  group: dyno-portal
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright drives the render locally now — the proxy was only ever
      # supplying a browser for this board, not a residential IP.
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Dyno Nobel careers (AU + Americas) → D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/dyno-to-d1.py
