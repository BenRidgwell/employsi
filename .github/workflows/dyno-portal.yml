# Daily Dyno Nobel → D1 archive (hosted, via the Oxylabs Web Scraper API).
#
# Dyno Nobel's Australian board is the OLD SuccessFactors RCM career portal
# (career4.successfactors.com/career?company=IncitecPivot). It server-renders no
# job rows at all and fetches its results over DWR after load, so a Cloudflare
# Worker cannot read it — the same reason Sandfire and Stockland run here.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + notification) when the portal returns no job
# rows, because a 3,000-person explosives manufacturer with operations in five
# states does not stop advertising — zero means the render did not settle.

name: dyno-portal

on:
  schedule:
    - cron: '10 18 * * *' # 18:10 UTC daily (~05:10 AEST)
  workflow_dispatch: {}

concurrency:
  group: dyno-portal
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scrape Dyno Nobel careers → D1
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/dyno-to-d1.py
