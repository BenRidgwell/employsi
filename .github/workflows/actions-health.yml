# Daily triage of the previous night's workflow failures. REPORT ONLY.
#
# The scrapers already fail loudly when a feed breaks — that is deliberate, and
# documented in each workflow. What was missing is somebody reading the red X.
# This runs after the night's feeds have landed, reads the failures, works out
# which are ours, and writes what it found into ONE tracking issue.
#
# IT DOES NOT PUSH. `contents` is read-only at the job level, so a fix cannot be
# committed even if the model decides it should be. The intent is to see how it
# categorises real failures — above all, whether it leaves a DELIBERATE red X
# alone — before it is trusted with commit rights. Promoting it later is a
# permissions change plus a change to section 4 of the prompt, nothing more.
#
# Required repo secret:
#   CLAUDE_CODE_OAUTH_TOKEN — generated by running `claude setup-token` locally.
#     This authenticates against the Claude subscription rather than API
#     credits, so the nightly triage does not open a second billing line. The
#     action also accepts `anthropic_api_key` instead if that is ever wanted;
#     swapping is a one-line change here plus the matching secret.
#
# Use "Run workflow" to triage on demand.

name: actions-health

on:
  schedule:
    # 01:00 UTC daily — ~90 minutes after scraper-health (23:30 UTC), which is
    # the last job of the night, so every run has settled before this looks.
    #
    # IT DOES NOT ACTUALLY FIRE AT 01:00, and the gap is large enough to write
    # down rather than leave someone to rediscover. Measured across the twelve
    # scheduled runs 2026-09-07 to 2026-09-18, every one of them started between
    # 05:19 and 05:42 UTC — 4.3 to 4.7 hours late, consistently, which is
    # GitHub queuing scheduled work away from the top of the hour rather than
    # anything here.
    #
    # It is left at 01:00 because the delay is harmless for what this job is
    # for: the thing the timing had to clear was scraper-health at 23:30, and
    # 05:30 clears it by more than 01:00 would. It stopped being able to open a
    # reporting gap at all once the window below was anchored to the last
    # successful run rather than to a fixed 24 hours.
    - cron: '0 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: actions-health
  cancel-in-progress: false

permissions:
  # Read-only on the repo: this job reports, it does not fix.
  contents: read
  # The one thing it does write.
  issues: write
  # Required by the action itself, which mints an OIDC identity token and
  # exchanges it for its GitHub credentials. Without it the step dies in 18
  # seconds with "Could not fetch an OIDC token" before Claude ever starts.
  #
  # This is NOT repository write access. It grants the ability to prove this
  # workflow's identity to an external service, nothing more — `contents: read`
  # above is still what governs the repo, so the job remains unable to commit.
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Tools are DENIED by default. Without an allowlist every command comes
      # back "requires approval", and on a runner there is nobody to approve
      # them — the first working run spent its whole budget being refused `gh
      # run list`, `git ls-remote` and `WebFetch` in turn, then correctly
      # declined to invent a report it could not gather. Reading runs and logs
      # is the entire job, so those tools have to be granted up front.
      #
      # Bash is allowed broadly because the triage needs `gh` across runs, jobs,
      # logs and issues, and enumerating those subcommands would silently break
      # the moment one is missing. The blast radius is bounded elsewhere and
      # better: `contents: read` means a push cannot succeed whatever is run.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reading another workflow's runs and logs needs this on top of the
          # job-level permissions above.
          additional_permissions: |
            actions: read
          # 40 WAS NOT A SAFETY LIMIT, IT WAS THE BINDING CONSTRAINT. Measured
          # across the twelve scheduled runs 2026-09-07 to 2026-09-18: six died
          # on `error_max_turns` at 41, and the six that finished used 23, 31,
          # 31, 34, 39 and 40. Two of the successes came within a single turn of
          # the cap. Whether this control worked on a given night was decided by
          # how many failures there were to read, which is exactly backwards —
          # the busiest nights are the ones a health check must not miss, and
          # those are the nights it died on.
          #
          # The triage itself flagged this on 2026-09-05, 09-09 and 09-14
          # ("needs a turn-budget fix that keeps getting flagged and not
          # applied"). This applies it.
          #
          # 80 rather than 50 because of the catch-up window in the prompt: a
          # run that follows a failed one now covers several days of failures in
          # one pass, and that is precisely when turns are scarcest. A quiet
          # night still stops when it is done — the cap costs nothing it does not
          # use — so the asymmetry is all one way: a truncated run loses 100% of
          # its value, and headroom on a night that does not need it loses
          # nothing. At ~$1.30 for 40 turns the worst case is a few dollars,
          # against a 30-minute job timeout that the longest run so far (6.1 min)
          # does not approach.
          #
          # THESE LINES ARE A YAML COMMENT ABOVE THE KEY, NOT TEXT INSIDE IT.
          # `claude_args` is a `|` block scalar, so a `#` line written inside it
          # is part of the string handed to the action rather than a comment,
          # and would be passed along as an argument.
          claude_args: |
            --max-turns 80
            --allowedTools Bash,Read,Grep,Glob,WebFetch,Write
          prompt: |
            Triage GitHub Actions failures in this repository (BenRidgwell/employsi —
            the Employsi labour-market map) since the last time this triage completed,
            and record what you find. This run is REPORT ONLY: you have read-only access
            to the repository and must not commit, push, or open a pull request.

            ## 1. Work out the window FIRST, then find what failed

            The window starts when the most recent SUCCESSFUL `actions-health` run
            before this one STARTED, and ends now:

                gh run list --workflow actions-health.yml --status success \
                  --limit 1 --json databaseId,startedAt,updatedAt

            Its start rather than its finish, deliberately. A run takes minutes to
            work through the logs, and anything that failed while it was doing so is
            already behind its own cursor. Overlapping by those few minutes re-reports
            something at worst; anchoring to the finish drops it silently, which is the
            failure this whole section exists to remove.

            SINCE THE LAST SUCCESSFUL RUN, NOT THE LAST 24 HOURS. A fixed 24-hour window
            is anchored to a run that might not have happened. When this workflow dies —
            and it has, six nights in twelve between 2026-09-07 and 2026-09-18 — every
            failure inside that window is never looked at again by anyone, because the
            next run's 24 hours start after them. That is not hypothetical: `skills-check`
            broke on 2026-09-12 and ran red for six days without appearing in a single
            report, because the one triage whose window covered it died mid-run, and the
            next one began its 24 hours after those failures had aged out.

            If no successful run is found, or the last one was more than 7 DAYS ago, use 7
            days. The floor is there so a long outage produces a bounded catch-up pass
            rather than a walk through the entire run history.

            SAY WHAT WINDOW YOU USED, always, in the issue and in the dated comment — the
            start, the end, and how many runs you looked at. When it is wider than about
            26 hours, say that this is a CATCH-UP pass and name the failed run that made
            it one. A reader has to be able to tell "nothing failed last night" from
            "nobody looked last night".

            Skip runs still in progress. For every run with conclusion `failure` or
            `cancelled`, read the failing job's logs before forming a view.

            EVERY WORKFLOW COUNTS, NOT JUST THE NIGHTLY SCRAPERS. The scrapers are the
            loudest failures here and the easiest to mistake for the whole job, but the
            checks that run on push — `skills-check`, `scraper-check`, `portal-ticks-check`,
            `roster-check` — are the ones guarding the data honesty this repo is built on,
            and a check can fail without ever failing an assertion. `skills-check` spent
            six days reporting red because three of its steps could not START: no
            dependency install, so they died on a missing package before evaluating
            anything. A red X that means "did not run" reads exactly like one that means
            "caught something", and only the log tells them apart.

            INCLUDING THIS WORKFLOW. `actions-health` is a control, and a control that
            stops working is the most expensive thing here to miss — it fails silently by
            definition, because the thing that would have reported it is the thing that
            broke. You may judge that its failures were its own setup and are resolved, but
            you must SAY you are excluding them and why. Never drop them without comment:
            the first time this workflow breaks for a real reason, that comment is the only
            thing standing between the breakage and nobody noticing.

            ## 2. Categorise each failure

            The whole value of this job is in telling these apart:

            (a) A REAL CODE BUG in the repo — a parser that throws, a renamed function, a bad
            import, a dependency that moved. Actionable by us.

            (b) AN UPSTREAM SITE CHANGE — the board changed its API shape, field names, or
            pagination. Actionable, but the new shape has to be VERIFIED against the live
            endpoint before anyone writes a parser for it. If you can check it, say what you
            observed. Never infer the new shape from the error message alone and present that
            as fact.

            (c) AN UPSTREAM BLOCK OR OUTAGE — 403, 429, a DataDome or Cloudflare challenge, a
            timeout, a 5xx. Not actionable by us. Note it, and say if it has persisted across
            several days.

            (d) A DELIBERATE LOUD FAILURE. Read this carefully before writing anything.
            Several workflows here are BUILT to exit non-zero when a feed goes quiet —
            `jobstreet-archive`, `jobstreet-ph-archive` and `scraper-health` all do. Those
            boards return `totalCount 0` rather than an error when a parameter goes stale, so
            silence is indistinguishable from an empty market, and the red X IS the alarm
            working as designed. Never recommend fixing one by loosening its threshold,
            softening its exit code, or making a check tolerate zero rows. The question to
            answer is WHY the feed went quiet. If you cannot tell, say so and call it a broken
            feed.

            Read CLAUDE.md at the repo root for the architecture, the two-Worker split, the
            dedup key and the conventions before judging whether something is a bug.

            ## 3. Write it into ONE issue

            Search open issues for one titled exactly `Nightly Actions health`.

            - If it exists, REPLACE its body with today's findings and add a dated comment
              summarising what changed since the last run — newly broken, still broken, now
              recovered.
            - If it does not exist AND there is something to report, create it with that exact
              title and the label `actions-health`.
            - If NOTHING failed IN THE WINDOW: add a single dated comment saying so — naming
              the window, as above — if the issue is open, and close it. Do not create an
              issue just to say all is well. On a catch-up pass this is a stronger claim than
              usual and is worth making explicitly: it says nothing failed across several
              days, not merely that nobody looked.

            In the body, for each failure give: the workflow name, a link to the run, the
            category from section 2, the specific evidence from the log you based that on, and
            a concrete suggested fix. Where you are unsure, say so plainly rather than
            guessing — a confident wrong diagnosis in this repo costs more than an open
            question.

            ## 4. Do not fix anything

            No commits, no pushes, no pull requests, no edits to workflow files. If a fix is
            obvious, describe it in the issue and stop there. Someone will read it.

            ## 5. Record what you did — REQUIRED, always, as the last thing you do

            Write ONE line to the file `triage-status.txt` in the repository root. The job
            reads it and fails if it is missing, so a run that quietly did nothing cannot
            report success:

              REPORTED <n>     you wrote <n> failures into the issue
              CLEAN            no failures in the window
              BLOCKED <why>    you could not complete the triage — say what stopped you

            Use BLOCKED if anything prevented you from reading the runs or writing the
            issue, including a tool you were not permitted to use. Do not write REPORTED or
            CLEAN unless you actually did that work. A blocked run SHOULD fail the job:
            silence that looks like success is the exact failure this whole workflow exists
            to catch.

      - name: Fail if the triage did not actually run
        if: always()
        run: |
          # A green run that did nothing is worse than a red one: it is a
          # control that has quietly stopped working. The agent writes its own
          # verdict; anything other than REPORTED/CLEAN — including no file at
          # all, which is what a crashed or permission-blocked run leaves — is
          # a failure.
          if [ ! -f triage-status.txt ]; then
            echo "::error::No triage-status.txt — the triage did not complete."
            exit 1
          fi
          STATUS="$(head -1 triage-status.txt)"
          echo "Triage status: $STATUS"
          case "$STATUS" in
            REPORTED*|CLEAN*) echo "Triage completed." ;;
            *) echo "::error::Triage did not complete: $STATUS"; exit 1 ;;
          esac
