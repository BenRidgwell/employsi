# ZipRecruiter reachability probe — a measurement, not a feed. Reads pages
# through SCRAPE_PROXY (US exit), writes nothing to D1, uploads every body it
# saw. scripts/probe-ziprecruiter.py records the three rounds run 2026-09-24
# and what each found; re-dispatch it before trying ZipRecruiter again.
#
#   mode=pages  three browser profiles against the listing pages (rounds 1-2)
#   mode=api    the site's own web API, from inside the cleared home page (round 3)
name: ziprecruiter-probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pages = browser profiles vs listing pages; api = the web API'
        type: choice
        options: [pages, api]
        default: pages

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium + Chrome
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m playwright install --with-deps chrome
      - name: Probe ZipRecruiter through SCRAPE_PROXY (US exit)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          SCRAPE_PROXY_COUNTRY: us
          OUT_DIR: zr-probe
          PROBE_MODE: ${{ inputs.mode }}
        # xvfb-run for the headful Chrome profile; the others ignore the display.
        run: |
          sudo apt-get install -y -q xvfb >/dev/null
          xvfb-run -a python scripts/probe-ziprecruiter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zr-probe
          path: zr-probe/
          retention-days: 3
