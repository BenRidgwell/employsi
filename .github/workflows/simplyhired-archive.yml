# Daily SimplyHired Australia → D1 archive, one search per rostered company.
#
# simplyhired.com.au 403s a datacentre IP outright, so this runs here rather than
# in the jobs-cron Worker, through a residential exit (SCRAPE_PROXY / IPRoyal).
#
# Measured 2026-08-09 from a GitHub runner (probe-headless-ci.py, reproduced on
# a second run): headless Chromium through that exit loaded the live BHP search
# and counted 21 rows. A plain urllib request through the SAME exit did not —
# only 1 of 12 boards answered that way — so the browser is doing real work
# beyond carrying the address. It clears the Cloudflare challenge once, and
# every search page after it is a fetch() from inside the cleared page, which
# also returns the server's own bytes: __NEXT_DATA__ is parsed out of the raw
# body, not out of a serialised DOM.
#
# The board still needs no JS render — the results ship in that payload — so
# the browser is the challenge-clearer, not the renderer.
#
# Unlike the career-portal feeds, which read one employer's own board, this is an
# aggregator: it indexes agency-posted and third-party-posted ads that an
# employer's portal never shows. Rows are only filed under a company when the
# board's own advertiser string passes scripts/advertiser_match.py.
#
# Required repo secrets:
#   SCRAPE_PROXY                        — residential exit, http://user:pass@host:port
#   CLOUDFLARE_API_TOKEN                — a token with D1 edit on the employsi account
# Pass --oxylabs (with OXYLABS_USERNAME / OXYLABS_PASSWORD restored to the env
# below) to put the Web Scraper API back if IPRoyal stops getting through.
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero when the whole roster matches nothing, or when more than
# a quarter of the searches fail — either is the board blocking us, not a market
# with no vacancies.

name: simplyhired-archive

on:
  schedule:
    - cron: '40 18 * * *' # 18:40 UTC daily (~05:40 AEST)
  workflow_dispatch: {}

concurrency:
  group: simplyhired-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape SimplyHired AU → D1 (browser via SCRAPE_PROXY)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. simplyhired.com.au 403s a datacentre"
            echo "address, so this would only collect challenge pages."
            exit 1
          fi
          python scripts/simplyhired-to-d1.py
