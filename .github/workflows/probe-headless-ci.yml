# One-off measurement, not a feed: does a headless browser on an ORDINARY
# GitHub runner get these boards, or do they need the residential IP too?
#
# Covers the WHOLE Oxylabs surface — the render-gated boards it started with,
# plus the eleven feeds that go through the proxy for the exit ADDRESS (Jora,
# SimplyHired, LinkedIn jobs and posts, GulfTalent, startup.jobs, the NSW bearer
# step, jobs.govt.nz, NAB, Auckland Airport, TechnologyOne). Most of those
# dependencies are beliefs rather than measurements, and one of them —
# jobs.govt.nz — was already wrong once, moved off the proxy on a sandbox probe
# and timed out on every request from the first real run.
#
# Seven feeds go through Oxylabs with render=True — Stockland, Dyno Nobel and
# Sandfire (SuccessFactors), Whitehaven (Dayforce), APS Jobs (Salesforce Aura),
# Naukri and Zhaopin. Probed without a browser they return a full-looking page
# carrying no readable jobs, because the results arrive after load. That proves
# they need a browser; it says nothing about the IP.
#
# Measured 2026-08-04: five of the seven need ONLY the browser. Naukri (Akamai
# 403) and Zhaopin (a 200 challenge page) need the residential IP as well.
#
# The answer decides how much of the Oxylabs bill a self-hosted Playwright could
# remove on its own — no proxy, no hardware. So it is worth one runner-minute to
# know rather than assume.
#
# TWO QUESTIONS, chosen at dispatch:
#
#   via_proxy=false (default)  does a plain CI address get these boards?
#   via_proxy=true             does OUR residential exit get them? Needs the
#                              SCRAPE_PROXY secret (http://user:pass@host:port).
#                              The run also fetches the runner's own address
#                              with no proxy and FAILS if the two match — a
#                              misconfigured proxy otherwise passes everything
#                              and reads as "our exit works" when it was never
#                              used.
#
#   proxy_check=true           stop after that address check. Three requests
#                              instead of most of an hour, for confirming the
#                              secret's format before spending the hour.
#
# SETTING SCRAPE_PROXY (repo secret, Settings > Secrets and variables > Actions).
# For IPRoyal residential the endpoint is geo.iproyal.com:12321 and the
# targeting options ride on the PASSWORD:
#
#   http://USER:PASS_country-au@geo.iproyal.com:12321                rotating
#   http://USER:PASS_country-au_session-ab12_lifetime-30m@geo...     sticky
#
# Percent-encode the password if it contains @ or : — proxy_from_env() decodes
# it back before handing it to Chromium.
#
# Use a STICKY session for a volume walk. The walk is asking whether one
# residential address survives 355 searches a night; a rotating pool answers
# with 355 different addresses, which is a much better-looking number about a
# different question. The run samples the address twice and reports which mode
# it got, so a rotating result cannot be mistaken for a sticky one.
#
#   aps_paging=true            APS Jobs only, and a different KIND of question:
#                              not "can we reach it" — we can, nightly, from a
#                              plain runner — but "does anything advance it past
#                              the first fifteen rows". The nightly walk pages by
#                              rewriting ?offset= and gets the SAME fifteen jobs
#                              back on page 2, then stops and reports 15 as the
#                              whole federal board across 49 agencies. This
#                              compares job IDENTITY across pages, captures the
#                              board's own advertised total, and dumps the
#                              pagination controls in the DOM. ~2 minutes; skips
#                              every other board.
#
#   tunnel_check=true          NOT a board question. PROXY FAIL is one bucket
#                              hiding a provider domain blocklist, a plan
#                              restriction and DNS, and Chromium collapses all
#                              three into ERR_TUNNEL_CONNECTION_FAILED. This
#                              speaks HTTP CONNECT to the proxy directly, so the
#                              proxy's OWN status line is the diagnosis — 403 is
#                              a blocklist, 407 is credentials, 502 is upstream.
#                              A control host runs in the same pass, because
#                              "the tunnel failed" and "the proxy is down today"
#                              are otherwise the same output. Needs via_proxy.
#
#   nab_route=true             careers.nab.com.au SERVER-RENDERS its job list and
#                              its first request from a plain address works — the
#                              AWS WAF flags by volume, not by client. So: how far
#                              does a PACED walk get with no proxy, and does the
#                              page call a JSON API on a host the WAF does not
#                              cover? This repo has twice found an ATS API that
#                              way. Run it WITHOUT via_proxy — a plain address is
#                              the question.
#
#   fingerprint=true           Does a better CLIENT beat Akamai and the captcha?
#                              Through the same IPRoyal exits, plain urllib
#                              recovered 1 of 12 boards and Chromium 11 of 20 —
#                              a ~10x gap that was entirely the client, not the
#                              address. So the three still on Oxylabs may be a
#                              harder version of that gap. Runs each board TWICE
#                              in one job: today's chromium-headless-shell, then
#                              real Chrome headful under Xvfb with the stealth
#                              patches. A control board that already works runs
#                              in both, and the run refuses to print a verdict
#                              unless it passes the baseline first. Use with
#                              via_proxy=true — these targets refuse a plain
#                              address regardless of client.
#
#   volume=N                   walk N DIFFERENT company queries through Indeed,
#                              SimplyHired and Jora and report where blocking
#                              starts. Those three walk 355 companies a night,
#                              and what stops them is not the first request but
#                              the four-hundredth from one address — which a
#                              single-request probe cannot see. Start around
#                              60-80; a full 355 takes a while.
#
# Manual only (workflow_dispatch). It writes nothing to D1. Re-run it whenever
# one of those boards changes platform.

name: probe-headless-ci

on:
  workflow_dispatch:
    inputs:
      via_proxy:
        description: 'Egress through SCRAPE_PROXY instead of the runner address'
        type: boolean
        default: false
      proxy_check:
        description: 'Only verify SCRAPE_PROXY works and stop (needs via_proxy)'
        type: boolean
        default: false
      volume:
        description: 'Volume walk: N different company queries per roster-wide feed (0 = skip)'
        type: string
        default: '0'
      aps_paging:
        description: 'APS only: does anything advance the board past page 1? (~2 min, skips everything else)'
        type: boolean
        default: false
      tunnel_check:
        description: 'Does SCRAPE_PROXY open a CONNECT tunnel to LinkedIn / NAB at all? (seconds; needs via_proxy)'
        type: boolean
        default: false
      nab_route:
        description: 'NAB only: how far does a paced walk get with NO proxy, and is there a JSON API? (~1 min)'
        type: boolean
        default: false
      fingerprint:
        description: 'A/B the client profile against the boards still on Oxylabs (~5 min; use with via_proxy)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Only for the fingerprint A/B, which needs the things the ordinary probe
      # deliberately does NOT have: real Google Chrome (not the headless-shell
      # build every other run uses) and a virtual display to run it headful in.
      - name: Install real Chrome + Xvfb
        if: inputs.fingerprint
        run: |
          python -m playwright install --with-deps chrome
          sudo apt-get install -y xvfb

      - name: Probe the boards
        env:
          # Only set when the run asks for it, so an unset secret cannot silently
          # turn a "from the runner" measurement into something else.
          SCRAPE_PROXY: ${{ inputs.via_proxy && secrets.SCRAPE_PROXY || '' }}
          # The probe writes nothing to D1, so nothing here needs to bypass the
          # proxy. The FEEDS do: scripts/*-to-d1.py post their rows to
          # api.cloudflare.com through the same urllib that fetches the boards,
          # so a naive HTTPS_PROXY on a feed workflow would route every archive
          # write through the home connection too. Recorded here because this is
          # where the pattern gets copied from.
          NO_PROXY: api.cloudflare.com
        # xvfb-run only where the fingerprint A/B asks for a headful browser;
        # every other mode runs exactly as it always has.
        run: |
          ${{ inputs.fingerprint && 'xvfb-run -a' || '' }} \
          python scripts/probe-headless-ci.py --json headless-probe.json \
            ${{ inputs.via_proxy && '--via-proxy' || '' }} \
            ${{ inputs.proxy_check && '--proxy-check' || '' }} \
            ${{ inputs.aps_paging && '--aps-paging' || '' }} \
            ${{ inputs.tunnel_check && '--tunnel-check' || '' }} \
            ${{ inputs.nab_route && '--nab-route' || '' }} \
            ${{ inputs.fingerprint && '--fingerprint' || '' }} \
            ${{ (inputs.volume != '' && inputs.volume != '0') && format('--volume {0}', inputs.volume) || '' }}

      - name: Upload the raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-probe
          path: headless-probe.json
          if-no-files-found: warn
