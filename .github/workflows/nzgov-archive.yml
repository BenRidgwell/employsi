# Daily New Zealand government jobs (jobs.govt.nz) → D1 archive, through Oxylabs.
#
# It was moved off the proxy on 2026-08-04, on a measurement that direct and
# proxied walks returned the same roles and the same failures. That measurement
# was taken from the dev sandbox, which egresses through an agent proxy — not
# from a GitHub runner. The first scheduled run on the direct path timed out on
# every request and collected nothing, so the proxy is back, and with it the
# credentials this file stopped passing when the feed went direct.
#
# "Works from the sandbox" is not evidence about a runner. Pass --direct to try
# the unproxied path again, but prove it from here before making it the default.
#
# Scrapes the all-of-government board filtered to Auckland and Wellington — the
# two New Zealand cities the app plots — and archives each role against its own
# agency, through the same key + upsert as every other source.
#
# Only those two cities are scraped on purpose: the whole board is ~1,860 roles
# nationwide, and archiving roles that no view can place would inflate
# market-wide counts with rows nothing can show.
#
# The run reports roles collected against roles advertised per city, so a
# partial walk is visible rather than silently looking like a quiet week. It
# exits non-zero only when BOTH cities come back empty, which means the search
# contract changed or we were blocked.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Web Scraper API sub-user credentials
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Use "Run workflow" to verify before relying on the schedule.

name: nzgov-archive

on:
  schedule:
    - cron: '30 19 * * *' # 19:30 UTC daily — ahead of the JobsDB/Jora runs
  workflow_dispatch: {}

concurrency:
  group: nzgov-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Scrape jobs.govt.nz → D1 (Oxylabs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: python scripts/nzgov-to-d1.py
