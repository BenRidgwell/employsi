# Job boards → D1, through Bright Data's per-board Scraper APIs.
#
# WHY EITHER BOARD IS HERE — two different dead ends, same answer.
#
#   linkedin  IPRoyal refuses a CONNECT tunnel to linkedin.com outright, so the
#             target is never even asked:
#
#                 www.linkedin.com  REFUSED  HTTP/1.1 403 Forbidden
#                                            X-Response-Origin: proxy-server
#
#             That is the proxy answering, measured 2026-08-09 with a control
#             host tunnelling fine in the same pass.
#
#   indeed    Three transports measured against the real 354-company walk on
#             2026-08-09 all returned a DataDome challenge on 432-442 KB of real
#             Indeed: headless-shell rotating, real Chrome + stealth rotating,
#             and headless-shell on a PINNED exit. Not the address, not the
#             browser build — what DataDome refuses is the sustained walk.
#             Oxylabs served it until that plan's quota ran out the same day.
#
# BILLING IS PER RECORD RETURNED, not per request — the only sources here shaped
# that way, and the ones most able to produce a surprise invoice. ~7,000 records
# a sweep means ~210k/month nightly against ~48k weekly, so this is weekly by
# design and the script caps records per run. Bright Data gives 5,000
# records/month free; start there with probe=true.
#
# THE SCHEDULE IS FORTNIGHTLY, AND THIS SWEEP IS NOT FREE. Billing is per record
# returned, so the cadence IS the invoice. Measured rate: 94 records over 6
# companies, ~15.7 per company. The roster is 354 companies, so one full sweep
# is roughly 5,500 records and a fortnightly cadence is ~12,000 records/month.
#
# BRIGHT DATA'S FREE ALLOWANCE IS 5,000 RECORDS/MONTH, so this is expected to
# bill — that is a deliberate choice for full-roster coverage, not an oversight.
# Nightly at this breadth would be ~165,000 records/month and is out of the
# question; even weekly is ~24,000. If the invoice needs to come down, reduce
# `limit` before reaching for the cadence: coverage per run is what costs money,
# and postings do not churn daily anyway — the archive's `seen_count` already
# tracks a role that stays up.
#
# `max_records` (default 20,000) is the backstop against a roster change or a
# hiring spree turning into an invoice nobody chose.
#
# THE SWEEP IS CHUNKED BECAUSE 354 COMPANIES DO NOT FIT IN ONE JOB. Measured on
# INDEED 2026-08-10: 20 companies took 28m41s (~1.4 min each), so a whole-roster
# run is ~8.5 hours against GitHub's 6-hour hard cap on a hosted runner. It would
# also fail to NOTHING — the snapshot is downloaded only once Bright Data reports
# it ready, so a timeout means the records were collected and billed but no row
# reached D1. FIVE chunks of 90 cover the roster: it was four, verified at 354
# companies, and four stopped covering it when the roster grew to 395 — indices
# 360-394 went unswept until 2026-09-03 (see the chunk note in `plan`).
#
# THE TWO BOARDS ARE NOT THE SAME SPEED. Both now measured at the production
# 90-company shape, 2026-08-11:
#
#   linkedin   90 companies ->  ~6 min   (2,457 records)
#   indeed     90 companies -> 44.7 min  (1,439 records; 44.3 of that is the
#                                         snapshot wait, the D1 write is ~30s)
#
# So Indeed is ~7x slower per chunk, but NOT the 1.4 min/company that the old
# 20-company run suggested — that extrapolation would have predicted 126 min and
# an 8.5-hour Indeed sweep. Measured is 0.50 min/company. A sweep of BOTH boards
# is therefore ~3.0 hours of Indeed plus ~24 min of LinkedIn: about 3.5 hours for
# all ten chunks, one at a time, well inside a single scheduled run.
#
# With Indeed gated off, the scheduled sweep is the ~30 min of LinkedIn's five.
#
# That is the number to re-check if the roster grows a lot.
#
# THE MEASUREMENTS ABOVE ARE WHAT A HEALTHY INDEED DOES, and since 2026-08-29 it
# has not been healthy. Every Indeed snapshot since then has been accepted,
# reported `running`, and never reached `ready` — six of them across four days,
# one left the full 300 minutes. LinkedIn collected normally throughout on the
# same account and token.
#
# THEY DO NOT TERMINATE, WHICH IS DIFFERENT FROM BEING SLOW, and the difference
# decides whether a longer wait would help. Measured 2026-09-05: the snapshot
# from the 2026-08-31 sweep, sd_mths10c46vu2a9aut, was re-polled with --snapshot
# and still reported `running` — 105 HOURS after it was triggered. Never `ready`,
# never `failed`.
#
# `failed` is the status the collector can act on, and Bright Data does not send
# it, so a wedged snapshot and a collecting one are indistinguishable from here.
# That is the concrete thing a support ticket needs, alongside the six ids.
#
# SO INDEED IS OFF THE SCHEDULE from 2026-09-05 (see `plan`). Dispatch still
# collects it, which is how the fix gets verified before the schedule trusts it.
#
# THREE THINGS WERE ELIMINATED BY MEASUREMENT, so nobody repeats them:
#
#   chunk size    a 20-COMPANY probe stalled exactly like the 90s (2026-09-02).
#                 The sweep briefly ran twenty chunks of 20 on the load theory
#                 and it changed nothing.
#   trigger mode  a collect-by-URL run through /scrape stalled too — that
#                 endpoint returns a snapshot id and converges on the same
#                 collection path (2026-09-02).
#   the account   LinkedIn, same token, same code, 3 of 4 chunks in 5-10 min.
#
# What is left is the Indeed dataset itself, which is Bright Data's side. The
# snapshot ids from those runs are what a support ticket needs.
#
# So the shape is back to chunks of 90 — FIVE of them, see `plan` — because with
# size ruled out the small shape was pure cost: the curve above is sublinear, so
# twenty chunks of 20 is ~10 hours of Indeed against ~3 for five of 90, and they
# run serially. That shape is what Indeed returns to when it is re-enabled.
#
# They run ONE AT A TIME regardless; see max-parallel below for why.
#
# If a chunk does time out, the snapshot id is in its log and `snapshot=<id>`
# re-downloads it without triggering — and without paying for the records twice.
#
# The Indeed scraper was verified against the live API on 2026-08-10 before this
# schedule was enabled: 94 records over 6 companies, title/company/location/url/
# posted all at 98.9%, salary_formatted arriving on 2.1% (advertisers mostly do
# not post pay). A 6-company probe took 9m47s and a 3-company one 2m23s, which
# is why `limit` stays modest — the full roster would run for hours and bill for
# thousands of records.
#
# Required repo secrets:
#   BRIGHTDATA_API_TOKEN   — API token
#   CLOUDFLARE_API_TOKEN   — D1 edit
#   BRIGHTDATA_DATASET_ID  — the JOBS scraper id for the board being collected.
#                            NEITHER source has a default: an id supplied on
#                            2026-08-09 answered `404 dataset does not exist`,
#                            and a default that 404s turns "you have not said
#                            which scraper" into "Bright Data is broken".
#                            Dispatch with list_datasets=true to print the ids
#                            on your account — that needs only the API token.
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
name: brightdata-archive

on:
  schedule:
    # FORTNIGHTLY, and cron cannot say that. This fires every Monday 17:20 UTC
    # and the job drops the odd ISO weeks, which gives a true 14-day gap rather
    # than the 13-17 day drift of a `1,15 * *` day-of-month schedule. Simulated
    # over a year from 2026-08-10: 25 runs, every gap 14 days except one.
    #
    # THAT EXCEPTION IS A 21-DAY GAP, not a short one. In a year with an ISO
    # week 53 — 2026 is one — weeks 53 and 1 are both odd, so two skips land
    # back to back across New Year. Harmless for a vacancy archive, but it is a
    # three-week hole and not the fortnight the schedule otherwise keeps.
    # A skipped week costs a few runner-seconds and is visible in the log.
    # 10 min ahead of nsw-gov (17:30) and clear of every other feed's slot.
    - cron: '20 17 * * 1'
  workflow_dispatch:
    inputs:
      list_datasets:
        description: 'Just list matching dataset ids and stop (needs only the API token)'
        type: boolean
        default: false
      grep:
        description: 'Filter that listing (comma-separated, or "all" — the account can see ~1900 datasets)'
        type: string
        default: 'indeed,linkedin,job'
      source:
        description: 'Which board to collect'
        type: choice
        options: [indeed, linkedin]
        default: indeed
      probe:
        description: 'Collect and report only — write nothing to D1'
        type: boolean
        default: true
      refresh:
        description: 'Re-scrape URLs the archive already has (collect-by-URL) instead of discovering new jobs'
        type: boolean
        default: false
      limit:
        description: 'Companies to search — "all" for the whole roster (billing is per record)'
        type: string
        default: 'all'
      offset:
        description: 'Start this far into the roster (with limit, sweeps one chunk)'
        type: string
        default: '0'
      timeout_min:
        description: 'Minutes to wait for the Bright Data snapshot before giving up'
        type: string
        default: '300'
      max_records:
        description: 'Hard cap on records kept from one run'
        type: string
        default: '20000'
      snapshot:
        description: 'Re-download an existing snapshot id instead of triggering a new collection'
        type: string
        default: ''
      input_json:
        description: 'Replace the search input verbatim (JSON object or array) — for testing a shape without a commit'
        type: string
        default: ''

# ONE SWEEP AT A TIME — but the four chunks WITHIN a sweep must run together,
# which is why this is keyed per workflow run rather than per workflow. Keying
# it globally would serialise the chunks and turn a ~2 hour sweep back into an
# ~8 hour one that cannot finish. Two separate sweeps overlapping would trigger
# two collections and pay for both, so runs still queue behind each other.
concurrency:
  group: brightdata-archive-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

jobs:
  # WHAT TO SWEEP, AND WHETHER TO SWEEP AT ALL. Kept out of the collecting job
  # so a skipped fortnight costs one trivial job rather than four, and so a
  # MANUAL dispatch runs ONCE instead of being multiplied by the matrix.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      sources: ${{ steps.p.outputs.sources }}
      run: ${{ steps.p.outputs.run }}
    steps:
      - id: p
        run: |
          # FORTNIGHTLY GATE. The cron fires weekly because cron cannot say
          # "every 14 days"; even ISO weeks collect, odd ones skip. A manual
          # dispatch always runs.
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WEEK=$(date -u +%V)
            if [ $((10#$WEEK % 2)) -ne 0 ]; then
              echo "ISO week $WEEK is odd; this feed is fortnightly. Skipping."
              RUN=false
            else
              echo "ISO week $WEEK is even; proceeding with the fortnightly sweep."
            fi
            # The scheduled sweep is the whole roster on LINKEDIN ONLY as of
            # 2026-09-05 — 5 jobs, each its own snapshot. Indeed is gated off
            # below; the two are separate scrapers, so dropping one costs the
            # other nothing.
            #
            # NINETY. It was 20 for one day (2026-09-02 to 09-03) on the theory
            # that Indeed's stall was a load problem, and it is back because the
            # theory was tested and is wrong: a 20-COMPANY probe stalled exactly
            # like the 90s, never reaching `ready` inside 45 minutes. Chunk size
            # is not the variable. Nor is trigger mode — a collect-by-URL run
            # through the /scrape endpoint stalled too, so both endpoints
            # converge on the same broken collection for this dataset.
            #
            # With size ruled out, the small shape was pure cost. Indeed's
            # snapshot time is heavily SUBLINEAR — 20 companies took 28m41s and
            # 90 took 44.7 min, both measured — so most of a chunk is fixed cost
            # and twenty small chunks are ~10 hours of Indeed against ~3 for
            # four big ones. They run strictly serially, so that is the sweep's
            # wall time, not one job's.
            #
            # LinkedIn is unaffected either way: it collected 3 of 4 chunks of
            # 90 in five to ten minutes each on the same account and token
            # throughout, and 90 is its measured shape.
            #
            # FIVE CHUNKS, NOT FOUR, AND THE FOURTH WAS SILENTLY LOSING 35
            # COMPANIES. [0,90,180,270] covers 0..359 and the roster is now 395,
            # so indices 360-394 — University of Newcastle .. Charles Darwin
            # University, the universities added later — had never been swept by
            # this workflow. The header's "four chunks of 90 exactly cover the
            # roster" was verified at 354 companies and quietly stopped being
            # true when the roster grew.
            #
            # Nothing reported it. A chunk that is never dispatched cannot fail,
            # so the sweep looked complete every fortnight while a tenth of the
            # roster was missing, and the archive simply held no Bright Data rows
            # for those employers. The twenty-chunk shape covered them by
            # accident; going back to 90 without adding the fifth chunk would
            # have lost them again.
            #
            # A roster that grows past 450 needs a sixth. Better still, derive
            # this from len(load_companies()) rather than editing a literal.
            #
            # WHAT THE SMALL SHAPE BOUGHT, AND WHAT IS GIVEN BACK: a dead chunk
            # loses 90 companies again rather than 20. That matters for
            # LinkedIn's [180:270], which has failed twice with zero records
            # (2026-08-17 and 2026-09-01) and is a poisoned company rather than
            # a stall — bisect it with --limit rather than shrinking the sweep
            # for everyone.
            echo 'chunks=[0,90,180,270,360]' >> "$GITHUB_OUTPUT"
            # INDEED IS GATED OFF THE SCHEDULE PENDING BRIGHT DATA, 2026-09-05.
            # Restore it by putting "indeed" back in this list — nothing else
            # here needs changing, and a dispatch can still collect Indeed today
            # (the else branch below reads inputs.source), which is how the
            # vendor's fix gets tested before the schedule depends on it again.
            #
            # WHY, and it is stronger evidence than the earlier stalls. The
            # snapshot from the 2026-08-31 sweep, sd_mths10c46vu2a9aut, was
            # re-polled on 2026-09-05 with --snapshot: still `running`, 105
            # HOURS after it was triggered. Not `ready`, not `failed`. So these
            # are not slow collections that would land if the wait were longer —
            # they never terminate, and no timeout value fixes that.
            #
            # THE COST OF LEAVING IT IN. The five Indeed chunks would each burn
            # the full 90-minute wait for zero rows: 7.5 hours of runner time a
            # fortnight, producing nothing, on a feed already proven stuck. And
            # a failing chunk every fortnight is exactly the noise that trained
            # everyone to ignore the Oxylabs reds in August, which is how the
            # real gap stayed invisible for a week.
            #
            # WHAT THIS DOES NOT DO — deliberately. The archive still has no
            # Indeed rows since 2026-08-17, and scraper-health.py is NOT muted
            # for it, so it goes CRITICAL at 22 days (~2026-09-08) and stays
            # there. That is correct: turning off a sweep does not make the data
            # fresh, and the staleness is the true statement about the feed. Do
            # not add indeed to QUIET_OK to make the check go green.
            echo 'sources=["linkedin"]' >> "$GITHUB_OUTPUT"
          else
            # A dispatch sweeps exactly the slice it was asked for, once.
            echo 'chunks=[${{ inputs.offset || 0 }}]' >> "$GITHUB_OUTPUT"
            echo 'sources=["${{ inputs.source || 'indeed' }}"]' >> "$GITHUB_OUTPUT"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  archive:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      # THE ROSTER IS SWEPT IN CHUNKS BECAUSE IT DOES NOT FIT IN ONE JOB.
      # 395 companies at the measured 0.50 min each is ~3.3 hours of Indeed
      # against a 6-hour hard cap on a hosted runner. Five chunks of 90 keep
      # each job well inside that; the chunk list, why it is 90 rather than 20,
      # and why Indeed is currently absent from `sources` all live in `plan`
      # above. A manual dispatch overrides these with its own offset/limit.
      #
      # THEY DO NOT RUN IN PARALLEL, whatever max-parallel suggests — this said
      # they did until 2026-09-01. The account gets one concurrent runner, so
      # the chunks serialise regardless, and every sweep on record shows each
      # job starting within seconds of the previous one ending. So a sweep's
      # wall time is the SUM of its chunks, not the longest one — which is why
      # gating Indeed off saves 7.5 hours a fortnight rather than nothing.
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
      # One chunk failing must not cancel the rest — each writes its own
      # employers, and a partial sweep beats no sweep.
      fail-fast: false
      # ONE SNAPSHOT AT A TIME. THIS IS MEASURED, NOT CAUTION.
      #
      # This was max-parallel: 8, on the reasoning that Bright Data bills per
      # record rather than per request, so parallel chunks cost what serial ones
      # do. That is true of the BILLING and false of the COLLECTION.
      #
      # Measured 2026-08-11. Three LinkedIn chunks triggered within 18 seconds
      # of each other: two returned ZERO records, one returned 870. Re-running
      # one of the failed slices ALONE, with the same offset, limit, dataset and
      # input, returned 1,908 records. Same request, opposite result — the only
      # variable was how many snapshots were open on the account:
      #
      #   offset 90   concurrent  12m35s  ->     0 records
      #   offset 90   alone        5m09s  -> 1,908 records
      #   offset 180  concurrent  16m10s  ->     0 records
      #   offset 270  concurrent   7m20s  ->   870 records
      #
      # Note the shape of the failure: the overflow snapshots did not error.
      # They waited LONGER than the one that worked, reported `ready`, and
      # delivered an empty file. Nothing in the API response says "throttled".
      #
      # At 8-wide the scheduled sweep would therefore have lost most of its
      # chunks every fortnight while several jobs still went green, and the
      # archive would have quietly held a fraction of the roster. A LinkedIn
      # chunk takes ~6 minutes, so serial costs the sweep under an hour.
      max-parallel: 1
    runs-on: ubuntu-latest
    # Sized for a 90-company chunk, which measured 44.7 min on 2026-08-11. The
    # script's own snapshot wait sits BELOW this on purpose, so it reports a
    # clean "not ready" and names the snapshot id instead of being killed
    # mid-download and leaving nothing to re-download with. On a schedule that
    # wait is 90 minutes, so 105 leaves room for the checkout, the two toolchain
    # setups and the D1 write.
    #
    # A DISPATCH CAN STILL ASK FOR 300, which is longer than this cap. That is
    # deliberate rather than an oversight: the long wait exists for
    # re-downloading a snapshot that is genuinely still collecting, and if the
    # job is killed at 45 the snapshot id is already in the log of the run that
    # created it, so the work is not lost — re-dispatch with --snapshot.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # bun runs scripts/map-skills.ts, so a LinkedIn role carries exactly the
      # skills the same title would get from any other source.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collect jobs → D1 (Bright Data)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          # PER-SOURCE FIRST. Each board is a different scraper with a different
          # id, and a scheduled sweep collects both in the same run — one shared
          # id would silently collect one board under the other's source tag and
          # bill for it. BRIGHTDATA_DATASET_ID stays as the fallback so an
          # existing single-source setup keeps working.
          BRIGHTDATA_DATASET_ID_INDEED: ${{ secrets.BRIGHTDATA_DATASET_ID_INDEED }}
          BRIGHTDATA_DATASET_ID_LINKEDIN: ${{ secrets.BRIGHTDATA_DATASET_ID_LINKEDIN }}
          BRIGHTDATA_DATASET_ID: ${{ secrets.BRIGHTDATA_DATASET_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          # Through the environment, NOT interpolated into the command line —
          # this is JSON full of quotes and braces, and pasting it into a shell
          # string is both fragile and an injection hole.
          INPUT_JSON: ${{ inputs.input_json }}
        run: |
          if [ -z "$BRIGHTDATA_API_TOKEN" ]; then
            echo "BRIGHTDATA_API_TOKEN is not set."
            exit 1
          fi
          if [ "${{ inputs.list_datasets }}" = "true" ]; then
            python scripts/brightdata-to-d1.py --list-datasets \
              --grep '${{ inputs.grep || 'indeed,linkedin,job' }}'
            exit $?
          fi
          # EVERY INPUT NEEDS A FALLBACK BECAUSE A SCHEDULED RUN HAS NO INPUTS.
          # On a `schedule` event the whole `inputs` context is null, so these
          # interpolate to empty strings and the run dies before it starts:
          #
          #     ValueError: invalid literal for int() with base 10: ''
          #
          # Confirmed by running the script with empty arguments. The defaults
          # declared on workflow_dispatch above do NOT apply to schedule.
          #
          # `probe` is deliberately left without one: null is falsy, so a
          # scheduled run collects for real, which is the point of scheduling it.
          EXTRA=()
          if [ -n "$INPUT_JSON" ]; then EXTRA+=(--input-json "$INPUT_JSON"); fi
          # NINETY MINUTES ON A SCHEDULE, NOT THREE HUNDRED. The chunks run
          # strictly serially (max-parallel: 1), so the wait is paid once per
          # chunk, and at the old 300 a fortnight where every snapshot stalled
          # would hold the runner for 40 HOURS. The 2026-09-01 sweep spent 20 on
          # four Indeed chunks before anyone looked.
          #
          # THIS NUMBER IS TIED TO THE CHUNK SIZE AND MUST MOVE WITH IT. A
          # healthy 90-company Indeed chunk MEASURED 44.7 min on 2026-08-11. The
          # cap was 45 while the sweep ran chunks of 20 (measured 28m41s), and
          # leaving it there when the chunks went back to 90 would have failed
          # working runs on 0.7% of headroom — the same mistake as the 30 that
          # briefly sat here against a 28m41s measurement.
          #
          # 90 is 2x the measurement: slack enough for Bright Data being slower
          # than measured, and still far below the >300 a real stall reaches.
          # Change the chunk size and this changes too, or the sweep starts
          # reporting healthy collections as timeouts.
          #
          # A dispatch keeps the long default, because a human watching one
          # chunk can afford to wait and may be re-downloading a snapshot that
          # genuinely takes hours.
          #
          # `refresh` IS DISPATCH-ONLY BY CONSTRUCTION, and that is the point
          # rather than an accident of how it is written. On a schedule the
          # whole `inputs` context is null, so `inputs.refresh` is falsy and the
          # flag never appears — which is what has to be true, because a
          # scheduled refresh would look like a working sweep while quietly
          # replacing it with a mode that CANNOT find a new posting. Indeed
          # would go green every fortnight, re-confirming a set that only
          # shrinks, until the feed was measuring its own history.
          #
          # NOTE FOR THE NEXT EDITOR: keep comments OUT of the argument list
          # below. The lines are joined by backslashes, so a `#` among them
          # comments out every argument after it and the run silently collects
          # the wrong thing.
          python scripts/brightdata-to-d1.py \
            --source '${{ matrix.source }}' \
            --offset '${{ matrix.chunk }}' \
            --limit '${{ github.event_name == 'schedule' && '90' || (inputs.limit || 'all') }}' \
            --max-records '${{ inputs.max_records || '20000' }}' \
            --timeout-min '${{ github.event_name == 'schedule' && '90' || (inputs.timeout_min || '300') }}' \
            ${{ inputs.snapshot != '' && format('--snapshot {0}', inputs.snapshot) || '' }} \
            ${{ inputs.probe && '--probe' || '' }} \
            ${{ inputs.refresh && '--refresh' || '' }} \
            "${EXTRA[@]}"
# THE SCHEDULE COLLECTS BOTH BOARDS — the matrix is source x chunk, so a
# fortnightly sweep is 10 jobs: indeed and linkedin, each over five chunks of 90.
# It briefly ran twenty chunks of 20 (2026-09-02 to 09-03) while chunk size was
# being tested as a cause of the Indeed stall; see the chunk note in `plan`.
#
# LINKEDIN IS PROVEN END TO END as of 2026-08-10, and the thing that was wrong
# is worth keeping written down. Its dataset (gd_lpfll7v5hcqtkxl6l, "Linkedin
# job listings information") accepted the trigger from the first attempt and
# returned ZERO records, because the employer name was going into `keyword`.
# LinkedIn keyword-matches TITLES AND DESCRIPTIONS, not the advertiser — so
# "BHP" matched nothing and the request looked valid the whole way. The employer
# belongs in `company`. Bright Data will state its own contract if you post an
# invalid field: it echoes the accepted keys back in the error.
#
# Measured on the first real chunk (offset 0, 90 companies): snapshot ready in
# 4m22s, 2457 records, 2332 kept for 43 employers, 1970 rows upserted (1878 new
# + 92 refreshed by job_key). title/company/location/url/posted all 100%.
# `salary` is returned on every record and is ALWAYS EMPTY — LinkedIn does not
# publish pay on these listings, so a blank there is correct, not a mapping bug.
#
# Use input_json to test a shape without a commit.
