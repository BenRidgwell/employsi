# Job boards → D1, through Bright Data's per-board Scraper APIs.
#
# WHY EITHER BOARD IS HERE — two different dead ends, same answer.
#
#   linkedin  IPRoyal refuses a CONNECT tunnel to linkedin.com outright, so the
#             target is never even asked:
#
#                 www.linkedin.com  REFUSED  HTTP/1.1 403 Forbidden
#                                            X-Response-Origin: proxy-server
#
#             That is the proxy answering, measured 2026-08-09 with a control
#             host tunnelling fine in the same pass.
#
#   indeed    Three transports measured against the real 354-company walk on
#             2026-08-09 all returned a DataDome challenge on 432-442 KB of real
#             Indeed: headless-shell rotating, real Chrome + stealth rotating,
#             and headless-shell on a PINNED exit. Not the address, not the
#             browser build — what DataDome refuses is the sustained walk.
#             Oxylabs served it until that plan's quota ran out the same day.
#
# BILLING IS PER RECORD RETURNED, not per request — the only sources here shaped
# that way, and the ones most able to produce a surprise invoice. ~7,000 records
# a sweep means ~210k/month nightly against ~48k weekly, so this is weekly by
# design and the script caps records per run. Bright Data gives 5,000
# records/month free; start there with probe=true.
#
# THE SCHEDULE IS FORTNIGHTLY, AND THIS SWEEP IS NOT FREE. Billing is per record
# returned, so the cadence IS the invoice. Measured rate: 94 records over 6
# companies, ~15.7 per company. The roster is 354 companies, so one full sweep
# is roughly 5,500 records and a fortnightly cadence is ~12,000 records/month.
#
# BRIGHT DATA'S FREE ALLOWANCE IS 5,000 RECORDS/MONTH, so this is expected to
# bill — that is a deliberate choice for full-roster coverage, not an oversight.
# Nightly at this breadth would be ~165,000 records/month and is out of the
# question; even weekly is ~24,000. If the invoice needs to come down, reduce
# `limit` before reaching for the cadence: coverage per run is what costs money,
# and postings do not churn daily anyway — the archive's `seen_count` already
# tracks a role that stays up.
#
# `max_records` (default 20,000) is the backstop against a roster change or a
# hiring spree turning into an invoice nobody chose.
#
# The Indeed scraper was verified against the live API on 2026-08-10 before this
# schedule was enabled: 94 records over 6 companies, title/company/location/url/
# posted all at 98.9%, salary_formatted arriving on 2.1% (advertisers mostly do
# not post pay). A 6-company probe took 9m47s and a 3-company one 2m23s, which
# is why `limit` stays modest — the full roster would run for hours and bill for
# thousands of records.
#
# Required repo secrets:
#   BRIGHTDATA_API_TOKEN   — API token
#   CLOUDFLARE_API_TOKEN   — D1 edit
#   BRIGHTDATA_DATASET_ID  — the JOBS scraper id for the board being collected.
#                            NEITHER source has a default: an id supplied on
#                            2026-08-09 answered `404 dataset does not exist`,
#                            and a default that 404s turns "you have not said
#                            which scraper" into "Bright Data is broken".
#                            Dispatch with list_datasets=true to print the ids
#                            on your account — that needs only the API token.
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
name: brightdata-archive

on:
  schedule:
    # FORTNIGHTLY, and cron cannot say that. This fires every Monday 17:20 UTC
    # and the job drops the odd ISO weeks, which gives a true 14-day gap rather
    # than the 13-17 day drift of a `1,15 * *` day-of-month schedule. Simulated
    # over a year from 2026-08-10: 25 runs, every gap 14 days except one.
    #
    # THAT EXCEPTION IS A 21-DAY GAP, not a short one. In a year with an ISO
    # week 53 — 2026 is one — weeks 53 and 1 are both odd, so two skips land
    # back to back across New Year. Harmless for a vacancy archive, but it is a
    # three-week hole and not the fortnight the schedule otherwise keeps.
    # A skipped week costs a few runner-seconds and is visible in the log.
    # 10 min ahead of nsw-gov (17:30) and clear of every other feed's slot.
    - cron: '20 17 * * 1'
  workflow_dispatch:
    inputs:
      list_datasets:
        description: 'Just list matching dataset ids and stop (needs only the API token)'
        type: boolean
        default: false
      grep:
        description: 'Filter that listing (comma-separated, or "all" — the account can see ~1900 datasets)'
        type: string
        default: 'indeed,linkedin,job'
      source:
        description: 'Which board to collect'
        type: choice
        options: [indeed, linkedin]
        default: indeed
      probe:
        description: 'Collect and report only — write nothing to D1'
        type: boolean
        default: true
      limit:
        description: 'Companies to search — "all" for the whole roster (billing is per record)'
        type: string
        default: 'all'
      timeout_min:
        description: 'Minutes to wait for the Bright Data snapshot before giving up'
        type: string
        default: '300'
      max_records:
        description: 'Hard cap on records kept from one run'
        type: string
        default: '20000'
      snapshot:
        description: 'Re-download an existing snapshot id instead of triggering a new collection'
        type: string
        default: ''

# One collection at a time. Two concurrent runs would trigger two collections
# and pay for both.
concurrency:
  group: brightdata-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # A FULL-ROSTER SWEEP IS 354 COMPANIES AND THE OLD 90 WAS SIZED FOR 20.
    # Measured: 3 companies 2m23s, 6 companies 9m47s. Extrapolating that rate to
    # 354 lands beyond even this, and 360 is GitHub's hard ceiling for a hosted
    # runner — so a full sweep may still be cut off, and the run will say so
    # rather than appearing to have collected everything. The script's own
    # snapshot wait (timeout_min) is set below this so it reports a clean
    # "not ready" instead of being killed mid-download.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # bun runs scripts/map-skills.ts, so a LinkedIn role carries exactly the
      # skills the same title would get from any other source.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collect jobs → D1 (Bright Data)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_DATASET_ID: ${{ secrets.BRIGHTDATA_DATASET_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          # FORTNIGHTLY GATE. The cron above fires weekly because cron has no
          # way to say "every 14 days"; even ISO weeks are collected and odd
          # ones skipped. A manual dispatch always runs — this only applies to
          # the schedule.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WEEK=$(date -u +%V)
            if [ $((10#$WEEK % 2)) -ne 0 ]; then
              echo "ISO week $WEEK is odd; this feed is fortnightly. Skipping."
              exit 0
            fi
            echo "ISO week $WEEK is even; proceeding with the fortnightly sweep."
          fi
          if [ -z "$BRIGHTDATA_API_TOKEN" ]; then
            echo "BRIGHTDATA_API_TOKEN is not set."
            exit 1
          fi
          if [ "${{ inputs.list_datasets }}" = "true" ]; then
            python scripts/brightdata-to-d1.py --list-datasets \
              --grep '${{ inputs.grep || 'indeed,linkedin,job' }}'
            exit $?
          fi
          # EVERY INPUT NEEDS A FALLBACK BECAUSE A SCHEDULED RUN HAS NO INPUTS.
          # On a `schedule` event the whole `inputs` context is null, so these
          # interpolate to empty strings and the run dies before it starts:
          #
          #     ValueError: invalid literal for int() with base 10: ''
          #
          # Confirmed by running the script with empty arguments. The defaults
          # declared on workflow_dispatch above do NOT apply to schedule.
          #
          # `probe` is deliberately left without one: null is falsy, so a
          # scheduled run collects for real, which is the point of scheduling it.
          python scripts/brightdata-to-d1.py \
            --source '${{ inputs.source || 'indeed' }}' \
            --limit '${{ inputs.limit || 'all' }}' \
            --max-records '${{ inputs.max_records || '20000' }}' \
            --timeout-min '${{ inputs.timeout_min || '300' }}' \
            ${{ inputs.snapshot != '' && format('--snapshot {0}', inputs.snapshot) || '' }} \
            ${{ inputs.probe && '--probe' || '' }}
# THE SCHEDULE COLLECTS INDEED ONLY. A schedule fires one source, and `source`
# falls back to indeed above. LinkedIn is still dispatch-only: its dataset id has
# not been confirmed — the two LinkedIn datasets found on the account were people
# profiles rather than job postings — so scheduling it would fire a run with the
# wrong id every Monday. Add a second workflow (or a matrix) once a manual
# LinkedIn run has worked.
