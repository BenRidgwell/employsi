# Skills-taxonomy integrity check — fails the build if the skill list ever
# regains a duplicate skill (or a same-named def with a conflicting category).
# This is the automated control that keeps the "no duplicate skills" fix from
# silently regressing (see scripts/check-skills.ts + skillsTaxonomy.ts).
#
# It also runs the Python-side tests for scripts/skills_taxonomy.py, the reader
# the AU/UK/EU/US vacancy generators share. A bug there does not crash anything
# — it quietly produces a plausible dataset with the wrong numbers in it, which
# is exactly what happened when a double-quoted term ("teacher's aide") was
# mis-tokenised into a bare ', ' that matched almost every occupation title.

name: skills-check

on:
  push:
    paths:
      - 'src/employsi/data/skillsTaxonomy.ts'
      - 'scripts/check-skills.ts'
      - 'scripts/skills_taxonomy.py'
      - 'scripts/test_skills_taxonomy.py'
      - 'scripts/gen-*-demand.py'
      - 'scripts/check-occupation-overrides.py'
      - 'scripts/check-salary-baseline.ts'
      - 'scripts/gen-salary-baseline.py'
      - 'src/employsi/data/salaryBaseline.ts'
      - 'scripts/check-analyst-followups.ts'
      - 'scripts/check-analyst-scope.ts'
      - 'scripts/check-skill-trends.ts'
      - 'scripts/check-news-skills.ts'
      - 'scripts/check-crawl-schedule.ts'
      - 'src/employsi/lib/crawlSchedule.ts'
      - 'workers/jobs-cron/wrangler.jsonc'
      - 'scripts/newsSkillFixtures.ts'
      - 'src/employsi/lib/newsSkills.ts'
      - 'src/employsi/lib/analystFn.ts'
      - 'src/employsi/lib/analystScope.ts'
      - 'src/employsi/lib/analystTurn.ts'
      - 'src/employsi/lib/jobArchive.ts'
      - 'src/employsi/lib/jobHistoryFn.ts'
      - 'src/employsi/data/companies.ts'
      - 'src/employsi/data/hiringAreas.ts'
      - 'src/employsi/lib/careerLadder.ts'
      - 'src/employsi/lib/ladderEmployers.ts'
      - 'scripts/check-career-ladder.ts'
      - 'scripts/check-career-card.ts'
      - 'src/employsi/lib/careerCard.ts'
      - 'src/employsi/lib/careerPathwaysBuild.ts'
      - 'src/employsi/lib/feedCoverage.ts'
      - 'src/employsi/data/careerPathways.ts'
      - '.github/workflows/skills-check.yml'
  pull_request:
    paths:
      - 'src/employsi/data/skillsTaxonomy.ts'
      - 'scripts/check-skills.ts'
      - 'scripts/skills_taxonomy.py'
      - 'scripts/test_skills_taxonomy.py'
      - 'scripts/gen-*-demand.py'
      - 'scripts/check-occupation-overrides.py'
      - 'scripts/check-salary-baseline.ts'
      - 'scripts/gen-salary-baseline.py'
      - 'src/employsi/data/salaryBaseline.ts'
      - 'scripts/check-analyst-followups.ts'
      - 'scripts/check-analyst-scope.ts'
      - 'scripts/check-skill-trends.ts'
      - 'scripts/check-news-skills.ts'
      - 'scripts/check-crawl-schedule.ts'
      - 'src/employsi/lib/crawlSchedule.ts'
      - 'workers/jobs-cron/wrangler.jsonc'
      - 'scripts/newsSkillFixtures.ts'
      - 'src/employsi/lib/newsSkills.ts'
      - 'src/employsi/lib/analystFn.ts'
      - 'src/employsi/lib/analystScope.ts'
      - 'src/employsi/lib/analystTurn.ts'
      - 'src/employsi/lib/jobArchive.ts'
      - 'src/employsi/lib/jobHistoryFn.ts'
      - 'src/employsi/data/companies.ts'
      - 'src/employsi/data/hiringAreas.ts'
      - 'src/employsi/lib/careerLadder.ts'
      - 'src/employsi/lib/ladderEmployers.ts'
      - 'scripts/check-career-ladder.ts'
      - 'scripts/check-career-card.ts'
      - 'src/employsi/lib/careerCard.ts'
      - 'src/employsi/lib/careerPathwaysBuild.ts'
      - 'src/employsi/lib/feedCoverage.ts'
      - 'src/employsi/data/careerPathways.ts'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # WITHOUT THIS, THREE OF THE FIVE CHECKS BELOW NEVER RUN. They do not fail
      # an assertion — they fail to START, and a job that dies before evaluating
      # anything is indistinguishable from one that caught a real regression.
      #
      # Measured 2026-09-18, reproducing a clean checkout locally: `bun run
      # scripts/check-analyst-followups.ts` with no node_modules dies with
      #
      #   error: Cannot find package 'react' from
      #     '~/.bun/install/cache/@tanstack/react-start@1.168.56/dist/esm/useServerFn.js'
      #
      # because check-analyst-followups, check-analyst-scope and check-skill-trends
      # import analystScope / analystFn / jobHistoryFn, every one of which pulls in
      # createServerFn — and bun's auto-install resolves the direct dependency
      # without resolving react underneath it. check-skills and
      # check-salary-baseline survived only because they import from data/, which
      # is plain data with no framework behind it.
      #
      # This workflow ran red on main for SIX DAYS on exactly that — nine
      # consecutive runs from 2026-09-12 — while reading as though the analyst
      # guards were being enforced. They are the checks the repo has precisely
      # because what they cover fails invisibly, so a red X that is really "did
      # not run" is the worst shape this could take.
      #
      # bun rather than npm: the repo carries bun.lock and bunfig.toml (whose
      # minimumReleaseAge supply-chain guard applies to an install here too), and
      # every step below is already a bun one. Measured at 3.2s for 436 packages,
      # so nothing is bought by caching it separately.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert no duplicate skills, and no skill name stranded in the archive
        # The D1 credentials are optional: without them the taxonomy checks
        # still run and the archive check reports itself as skipped, so a fork
        # or a secretless run is a pass rather than a false red.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JOBS_ARCHIVE_DB_ID: ${{ secrets.JOBS_ARCHIVE_DB_ID }}
        run: bun run scripts/check-skills.ts

      # The analyst's scope resolver reads the COMPANY ROSTER, so this can break
      # without anyone touching the analyst: adding an employer whose name is a
      # short ordinary word is enough to make a follow-up resolve to it. Runs on
      # companies.ts changes for exactly that reason.
      - name: Assert analyst follow-ups resolve to the right scope
        run: bun run scripts/check-analyst-followups.ts

      # The analyst answers about the market NOW and dates its evidence off
      # MIN(first_seen), so a scope that admits the closed Wayback corpus does
      # not answer with older data, it answers wrongly — it once reported
      # "2 roles live in the latest pull (2018-01-04)". One predicate on every
      # branch of scopeClause prevents that, and a new scope kind is exactly
      # what forgets it.
      - name: Assert every analyst scope excludes the closed corpora
        run: bun run scripts/check-analyst-scope.ts

      # News skill tags are an INFERENCE shown next to measured things, so the
      # only way a wrong one surfaces is by being read. A labelled corpus of 256
      # real headlines scores precision and recall on every change; the floors
      # are a ratchet meant to be raised, never lowered to go green.
      - name: Assert news skill tagging has not regressed
        run: bun run scripts/check-news-skills.ts

      # The company card's per-skill and per-area reconstruction. Everything it
      # can get wrong is invisible on the rendered chart — an off-by-one at a
      # window edge, pre-collection days counted as zero demand, a feed that
      # joined mid-window drawing its own arrival as growth.
      - name: Assert the card's skill and area trends reconstruct correctly
        run: bun run scripts/check-skill-trends.ts

      # The admin console restates the Worker's cron schedule so it can say when
      # a feed next runs. Two copies of a schedule drift, and this one drifts
      # silently into a card that names a time nothing will fire at — which is
      # the wrong answer to the only question the card exists for: is this feed
      # dead, or has it simply not run yet.
      - name: Assert the console's crawl schedule matches the Worker's
        run: bun run scripts/check-crawl-schedule.ts

      # The historical baseline is eight ATO vintages folded into one file, and
      # every way it can be wrong still renders a clean line and a tidy dollar
      # figure: a skill priced off one tiny occupation, a year read from the
      # average column instead of the median, a baseline stranded under a skill
      # name the taxonomy no longer has.
      # Career pathways place every title on a ladder with first-match-wins
      # regexes, so a rule added for one title can re-place thousands of others
      # and every pathway still renders six plausible rungs. The fixtures are the
      # only place that is visible, including the traps ("Barista $32/hr" is not
      # human resources; a Project Manager is not a people manager).
      - name: Assert career-ladder titles place on the right rung
        run: bun run scripts/check-career-ladder.ts

      # The career card draws a daily demand line, its trend and days
      # advertised over the archive — every one bounded at both ends by the
      # feed-coverage rules, or it draws a feed's arrival as hiring. Asserted on
      # synthetic rows whose answer is known, plus the adapter's invariants.
      - name: Assert the career card's series and model
        run: bun run scripts/check-career-card.ts

      - name: Assert the salary baseline's invariants
        run: bun run scripts/check-salary-baseline.ts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Taxonomy reader tests (generators' term matcher)
        run: python scripts/test_skills_taxonomy.py

      # OVERRIDE is shared by the IVI, ABS and ATO generators, so an entry added
      # for one of them edits the other two. The ATO-variance block is only safe
      # because every entry equals what the ABS label already matched; a
      # taxonomy edit can break that equality without breaking anything visible.
      - name: Assert the ATO-variance overrides stay no-ops for IVI and ABS
        run: python scripts/check-occupation-overrides.py
