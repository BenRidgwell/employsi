# Daily Jora (au.jora.com) → D1 archive, rendered in a local headless Chromium
# on the runner (no proxy).
#
# Jora 403s a plain datacentre REQUEST, which is why this went through Oxylabs
# with render=True — buying a browser and an address together. Measured
# 2026-08-08 it only ever needed the browser: a headless Chromium on an ordinary
# runner is fine. The evidence is the volume walk rather than a single request,
# because a single request proves nothing for a feed that walks 355 companies —
# 76 of 80 different company searches returned rows from a plain Azure address,
# while Indeed and SimplyHired, walked the same way in the same run, refused
# from request #1. See probe-headless-ci.yml --volume.
#
# The walk is SINGLE-THREADED on this path: Playwright's sync API must be driven
# from one thread. It can afford that because the challenge is cleared once and
# every search page after it is fetched at plain-HTTP speed (browser_fetch
# raw_get), rather than paying a full render per request.
#
# Every roster company is searched by legal name AND by a suffix-stripped brand
# form ("ANZ Group Holdings" → "ANZ", which is how it advertises), then the
# results are post-filtered to ads the company itself placed. The filter is
# whole-word token-subset, not substring, so "ABN" cannot match an Australian
# Business Number quoted in an unrelated ad.
#
# Rows are archived through the same key + upsert as every other source, so a
# role already held from Adzuna, SEEK or a career portal refreshes rather than
# duplicating.
#
# The script only exits non-zero when NOTHING matches across the whole roster,
# which means the search contract changed or we were blocked rather than the
# market being quiet.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Use "Run workflow" to verify before relying on the schedule.

name: jora-archive

on:
  schedule:
    - cron: '45 22 * * *' # 22:45 UTC daily — staggered after JobsDB (21:15)
  workflow_dispatch: {}

concurrency:
  group: jora-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Playwright: Jora is fetched by a local headless Chromium now, not through
      # Oxylabs. It went through the proxy with render=True, so it was buying a
      # browser AND an address; measured 2026-08-08 it only needed the browser.
      # The evidence is the volume walk, not a single request: 76 of 80
      # different company searches returned rows from a plain Azure address,
      # while Indeed and SimplyHired — walked the same way, same run — refused
      # from request #1.
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape Jora AU → D1 (rendered, local browser)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # The whole roster; 2 pages a search term, two terms per company. Jora
        # sorts by relevance, so the first two pages hold the company's own ads
        # and the tail is other employers' ads that merely mention the name.
        run: python scripts/jora-to-d1.py --max-pages 2 --concurrency 6
