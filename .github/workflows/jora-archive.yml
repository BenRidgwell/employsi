# Daily Jora (au.jora.com) → D1 archive, via the Oxylabs Web Scraper API.
#
# Jora 403s plain datacentre requests, so every fetch goes through Oxylabs for
# the residential IP, throttling and backoff — the same path the Indeed, Zhaopin
# and JobsDB scrapers use.
#
# Every roster company is searched by legal name AND by a suffix-stripped brand
# form ("ANZ Group Holdings" → "ANZ", which is how it advertises), then the
# results are post-filtered to ads the company itself placed. The filter is
# whole-word token-subset, not substring, so "ABN" cannot match an Australian
# Business Number quoted in an unrelated ad.
#
# Rows are archived through the same key + upsert as every other source, so a
# role already held from Adzuna, SEEK or a career portal refreshes rather than
# duplicating.
#
# The script only exits non-zero when NOTHING matches across the whole roster,
# which means the search contract changed or we were blocked rather than the
# market being quiet.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN                — D1 edit on the employsi account
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID
#
# Use "Run workflow" to verify before relying on the schedule.

name: jora-archive

on:
  schedule:
    - cron: '45 22 * * *' # 22:45 UTC daily — staggered after JobsDB (21:15)
  workflow_dispatch: {}

concurrency:
  group: jora-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Scrape Jora AU → D1 (Oxylabs)
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        # The whole roster; 2 pages a search term, two terms per company. Jora
        # sorts by relevance, so the first two pages hold the company's own ads
        # and the tail is other employers' ads that merely mention the name.
        run: python scripts/jora-to-d1.py --max-pages 2 --concurrency 6
