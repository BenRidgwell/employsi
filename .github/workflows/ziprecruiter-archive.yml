# Daily ZipRecruiter (US + Canada) → D1 archive, one search per rostered company.
#
# The transport is JobSpy (speedyapply/JobSpy) against api.ziprecruiter.com —
# the iOS app's API — the same package that recovered Indeed (indeed-archive.yml).
# scripts/ziprecruiter-to-d1.py has the detail; the short version:
#
# IT NEEDS THE RESIDENTIAL EXIT, UNLIKE INDEED. Measured 2026-09-24 from a plain
# datacentre address, every ZipRecruiter host refused before reading the request:
#
#     api /jobs-app/jobs    403 "forbidden aa"   (JobSpy's own TLS client)
#     api /jobs-app/jobs    403 "forbidden cf-waf"
#     www /jobs-search      403 "Just a moment..."  Cloudflare challenge
#
# So this goes through SCRAPE_PROXY with a US exit (SCRAPE_PROXY_COUNTRY=us —
# ZipRecruiter serves only the US and Canada). A GitHub runner's address is a
# datacentre address too, so there is no reason to expect it to fare better
# than the sandbox did; that is an expectation, not a measurement.
#
# THE RESIDENTIAL PATH IS UNMEASURED. Nothing from this repo has reached
# ZipRecruiter through the exit yet, so the FIRST RUN IS THE MEASUREMENT. The
# cheap way to take it is a dispatch with `limit: 25`, `na_only: true`,
# `dry_run: true` — seconds of proxy traffic, no D1 writes. Read three things off
# the log before trusting the schedule:
#
#   1. whether companies come back `kept` or `REFUSED (HTTP 403 ...)` — the
#      refusal line carries the WAF's own error code;
#   2. the "Rows span N states/provinces" line. JobSpy sends no location, and
#      it is not known whether the API then searches the whole country or the
#      exit's own metro. A national employer's rows landing in one or two
#      states would be the second, and would need a location added before the
#      schedule's numbers mean what they say. (SimplyHired's lesson, in reverse:
#      there, the obvious city filter would have archived one city's slice.)
#   3. whether big employers stop at 20 kept rows. The walk ends at the first
#      page that adds nothing past the gate, which assumes the board ranks an
#      employer's own ads ahead of ads that merely mention it — unmeasured.
#
# If the scheduled run goes red on refusals, pull the schedule rather than
# leave it crying wolf — indeed-archive.yml records why.
#
# JobSpy is PINNED. The script calls three of its internals (_find_jobs_in_page,
# _get_descr, the session's get) to stop it fetching every job's HTML page and
# to see the HTTP status it otherwise swallows. scripts/test_ziprecruiter.py
# drives those internals with a fixture; run it after any version bump.
#
# Required repo secrets:
#   SCRAPE_PROXY           — residential exit, http://user:pass@host:port (IPRoyal)
#   CLOUDFLARE_API_TOKEN   — a token with D1 edit on the employsi account
# Optional repo variables (fall back to values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero when the whole roster keeps nothing, or when more than
# a quarter of the searches are refused — either is the board blocking us, not
# a continent with no vacancies.

name: ziprecruiter-archive

on:
  schedule:
    # 16:00 UTC — a free slot, and done well before scraper-health (23:30).
    # Late morning on the US east coast; the board's own traffic is irrelevant
    # to an API walk this size.
    - cron: '0 16 * * *'
  # TEMPORARY — the first measurement, taken before this file is on main (a
  # workflow cannot be dispatched until it is). A push to this branch runs a
  # DRY run: 25 North American companies, no D1 writes. Remove before merge.
  push:
    branches: [claude/zealous-planck-7f1fge]
    paths: ['.github/workflows/ziprecruiter-archive.yml', 'scripts/ziprecruiter-to-d1.py']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Walk only the first N employers (blank = the whole roster)'
        type: string
        default: ''
      na_only:
        description: 'Only the US/Canadian-home companies (~246)'
        type: boolean
        default: false
      dry_run:
        description: 'Parse and report, write nothing to D1'
        type: boolean
        default: false
      proxy_country:
        description: 'SCRAPE_PROXY exit country (IPRoyal code)'
        type: string
        default: 'us'
      proxy_session:
        description: 'Optional sticky IPRoyal session id (blank = rotating)'
        type: string
        default: ''

concurrency:
  group: ziprecruiter-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JobSpy (pinned — see the header)
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ziprecruiter-requirements.txt
          python -c "import jobspy, importlib.metadata as m; print('python-jobspy', m.version('python-jobspy'))"

      - name: JobSpy internals still match what the script calls
        run: python scripts/test_ziprecruiter.py

      # TEMPORARY, with the push trigger: does the runner's OWN address get
      # through? If it does, the residential exit is not needed at all.
      - name: Measure — runner address, no proxy (dry, 5 companies)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python scripts/ziprecruiter-to-d1.py --direct --dry-run --na-only --limit 5

      - name: Scrape ZipRecruiter → D1 (JobSpy via SCRAPE_PROXY)
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          SCRAPE_PROXY_COUNTRY: ${{ inputs.proxy_country || 'us' }}
          SCRAPE_PROXY_SESSION: ${{ inputs.proxy_session }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          LIMIT: ${{ inputs.limit }}
          NA_ONLY: ${{ inputs.na_only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. ZipRecruiter 403s a datacentre"
            echo "address on every host, so this would only collect refusals."
            exit 1
          fi
          ARGS=""
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$NA_ONLY" = "true" ] && ARGS="$ARGS --na-only"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event_name }}" = "push" ] && ARGS="--dry-run --na-only --limit 25"
          python scripts/ziprecruiter-to-d1.py $ARGS
