# LinkedIn jobs → D1, through Bright Data's LinkedIn Jobs Scraper API.
#
# WHY THIS EXISTS ALONGSIDE linkedin-archive.yml
# The guest-API feed cannot move off Oxylabs the way every other feed did this
# week. IPRoyal refuses a CONNECT tunnel to linkedin.com outright — measured
# 2026-08-09 by probe-headless-ci.py --tunnel-check, with a control host
# tunnelling fine in the same pass:
#
#     www.linkedin.com   REFUSED   HTTP/1.1 403 Forbidden
#                                  X-Response-Origin: proxy-server
#
# That is the proxy answering, not LinkedIn. Most residential providers
# blocklist the domain, so a cheaper proxy is not the answer. Bright Data sells
# a purpose-built LinkedIn Jobs scraper instead of an address.
#
# BILLING IS PER RECORD RETURNED, not per request — the only source here shaped
# that way, and the one most able to produce a surprise invoice. 354 companies
# at ~20 live roles is ~7,000 records a sweep: nightly would be ~210k/month,
# weekly ~48k. Job postings do not churn daily and the archive ages rows out on
# last_seen, so this runs WEEKLY and the script caps records per run.
#
# THERE IS NO `schedule:` YET, on purpose. Nothing here has been run against the
# live API — it is written from Bright Data's published contract and this repo
# had no token to test with. Run it by hand with probe=true first, read the
# field-coverage table (particularly whether posted date and salary arrive,
# since the card shows both), and enable the schedule at the bottom once a real
# run has looked boring.
#
# Required repo secrets:
#   BRIGHTDATA_API_TOKEN   — API token
#   BRIGHTDATA_DATASET_ID  — the LinkedIn Jobs scraper id from the dashboard.
#                            Deliberately not defaulted anywhere: a wrong id
#                            collects the wrong thing and bills for it.
#   CLOUDFLARE_API_TOKEN   — D1 edit
# Optional repo variables: CF_ACCOUNT_ID, D1_DATABASE_ID

name: linkedin-brightdata

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Collect and report only — write nothing to D1'
        type: boolean
        default: true
      limit:
        description: 'Companies to search (start small — billing is per record)'
        type: string
        default: '20'
      max_records:
        description: 'Hard cap on records kept from one run'
        type: string
        default: '20000'
      snapshot:
        description: 'Re-download an existing snapshot id instead of triggering a new collection'
        type: string
        default: ''

# One collection at a time. Two concurrent runs would trigger two collections
# and pay for both.
concurrency:
  group: linkedin-brightdata
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # bun runs scripts/map-skills.ts, so a LinkedIn role carries exactly the
      # skills the same title would get from any other source.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collect LinkedIn jobs → D1 (Bright Data)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_DATASET_ID: ${{ secrets.BRIGHTDATA_DATASET_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -z "$BRIGHTDATA_API_TOKEN" ] || [ -z "$BRIGHTDATA_DATASET_ID" ]; then
            echo "BRIGHTDATA_API_TOKEN and BRIGHTDATA_DATASET_ID must both be set."
            echo "The dataset id is on the LinkedIn Jobs scraper's page in the dashboard."
            exit 1
          fi
          python scripts/linkedin-brightdata-to-d1.py \
            --limit '${{ inputs.limit }}' \
            --max-records '${{ inputs.max_records }}' \
            ${{ inputs.snapshot != '' && format('--snapshot {0}', inputs.snapshot) || '' }} \
            ${{ inputs.probe && '--probe' || '' }}
# Once a real run has succeeded and the coverage table looks right, add:
#
# on:
#   schedule:
#     - cron: '20 17 * * 1'   # weekly, Mondays. NOT nightly: billing is per
#                             # record, and postings do not churn daily.
