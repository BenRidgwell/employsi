# Employee reviews from Glassdoor → D1.
#
# READ scripts/glassdoor-to-d1.py's header before enabling this. Glassdoor's
# Terms prohibit scraping and its robots.txt disallows the review pagination
# this walks. That is the operator's decision, taken with the operator's
# account — use a DEDICATED account, never a personal one.
#
# WHY THERE IS NO `schedule:` HERE YET.
# A cron that runs before anyone has seen the scraper succeed is a cron that
# hammers a hostile target on a timer with nobody watching. Run it by hand,
# starting with probe=true, until the output is boring. The commented block at
# the bottom is the weekly schedule to enable once it is.
#
# Required repo secrets:
#   GLASSDOOR_EMAIL, GLASSDOOR_PASSWORD  — the dedicated account
#   SCRAPE_PROXY                         — residential exit; Glassdoor 403s
#                                          datacentre addresses (measured
#                                          2026-08-09, .com and .com.au)
#   CLOUDFLARE_API_TOKEN                 — D1 edit
name: glassdoor-reviews

on:
  workflow_dispatch:
    inputs:
      company:
        description: 'Roster company id (e.g. bhp)'
        type: string
        required: true
      url:
        description: "The company's Glassdoor reviews URL"
        type: string
        required: true
      probe:
        description: 'Read and report only — write nothing to D1'
        type: boolean
        default: true
      max_pages:
        description: 'Pages this run may read (hard ceiling 40)'
        type: string
        default: '3'

# One run at a time, ever. Two concurrent runs would double the request rate
# against a target we are trying to be gentle with, and would do it from two
# different exits — which is precisely what a ban heuristic is looking for.
concurrency:
  group: glassdoor
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      # The signed-in session is cached BETWEEN RUNS so a weekly job is not a
      # weekly sign-in. Repeated logins are the loudest thing this could do.
      - name: Restore the signed-in session
        uses: actions/cache@v4
        with:
          path: .glassdoor-state.json
          key: glassdoor-state-${{ github.run_id }}
          restore-keys: glassdoor-state-
      - name: Scrape reviews
        env:
          GLASSDOOR_EMAIL: ${{ secrets.GLASSDOOR_EMAIL }}
          GLASSDOOR_PASSWORD: ${{ secrets.GLASSDOOR_PASSWORD }}
          GLASSDOOR_STATE: .glassdoor-state.json
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NO_PROXY: api.cloudflare.com
        run: |
          if [ -z "$SCRAPE_PROXY" ]; then
            echo "SCRAPE_PROXY is not set. Glassdoor answers a datacentre address"
            echo "with 403 and a challenge body, so this would only collect refusals."
            exit 1
          fi
          python3 scripts/glassdoor-to-d1.py \
            --company '${{ inputs.company }}' \
            --url '${{ inputs.url }}' \
            --max-pages '${{ inputs.max_pages }}' \
            ${{ inputs.probe && '--probe' || '' }}
# Once a real run has succeeded and looked boring, add:
#
# on:
#   schedule:
#     - cron: '40 6 * * 1'   # weekly. Reviews arrive a handful a month per
#                            # company; nightly would be all cost and no data.
