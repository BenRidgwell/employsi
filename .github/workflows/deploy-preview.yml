# Deploy the APP worker to https://employsi-preview.employsi.workers.dev — the
# thing you send someone to look at.
#
# WHY THIS EXISTS. Until now there was no automated path to the preview Worker
# at all. `npm run deploy:preview` is in package.json, but nothing in .github/
# ran it, so refreshing the preview meant a shell with two tokens in it. The
# dashboard-side Workers Builds pipeline does NOT do this job: it publishes to
# the Worker the repo is CONNECTED to — today `employsi` — and it ignores the
# `--name` in the deploy command entirely (measured 2026-09-21; see CLAUDE.md).
#
# IN A GITHUB ACTION `--name` DOES STEER THE DEPLOY. That is the difference
# between this file and Workers Builds, and it is the whole safety story here:
# wrangler run from an ordinary shell publishes to the name on the command line,
# and only Cloudflare's own build pipeline overrides it. So this workflow can
# target the preview Worker and Workers Builds cannot.
#
# **`npx wrangler deploy` WITHOUT `--name` IS PRODUCTION — employsi.com.au.**
# The `--name employsi-preview` lives in `deploy:preview` in package.json rather
# than being written here, so the target is reviewable in the repo. If that
# script is ever edited to drop the flag, THIS WORKFLOW PUBLISHES THE LIVE SITE.
# The verify step below exists to catch exactly that, after the fact.
#
# MANUAL ONLY, deliberately. There is no `on: push`. An app deploy that happens
# because someone merged a branch is the blast radius this repo keeps closing.
#
# THE APP IS AT /app. `/` is the waitlist on every host, so the link to send is
#   https://employsi-preview.employsi.workers.dev/app
# and a reviewer sent to `/` sees the waitlist and nothing you built.
#
# It shares the PRODUCTION D1 and KV, on purpose — the point of the preview is
# real data. Reads are free; anything that writes needs thinking about first.

name: deploy-preview

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What is being previewed (goes in the run summary)'
        type: string
        required: false

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # VITE_MAPBOX_TOKEN IS A BUILD-TIME INLINE, not a Worker secret: vite bakes
      # it into the bundle, and a Worker secret is not visible to the build.
      # vite.config.ts throws without it, which is the guard working.
      #
      # DO NOT SATISFY IT WITH A PLACEHOLDER. The build succeeds, the deploy
      # succeeds, and the map then fails to render for every visitor — a green
      # pipeline over a broken page. Checked explicitly here so the failure names
      # what is missing instead of surfacing as a vite stack trace.
      #
      # A SECRET **OR** A VARIABLE IS ACCEPTED, and that is not laziness. A
      # Mapbox PUBLIC token (pk.…) is inlined into the client bundle and served
      # to every visitor, so it is not secret in any useful sense and
      # `Settings -> Secrets and variables -> Actions -> Variables` is a
      # perfectly reasonable home for it. The first run of this workflow failed
      # here with CLOUDFLARE_API_TOKEN present and this one empty, which is
      # exactly what a value living in the other tab looks like.
      - name: Check the tokens are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAPBOX_FROM_SECRET: ${{ secrets.VITE_MAPBOX_TOKEN }}
          MAPBOX_FROM_VAR: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          token="${MAPBOX_FROM_SECRET:-$MAPBOX_FROM_VAR}"
          if [ -n "$MAPBOX_FROM_SECRET" ]; then src="repository secret"
          elif [ -n "$MAPBOX_FROM_VAR" ]; then src="repository variable"
          else src="nowhere"; fi
          echo "VITE_MAPBOX_TOKEN source: $src"
          # Never echo the value; only its shape, which is what tells a real
          # Mapbox public token from a placeholder someone pasted to get a build.
          case "$token" in
            pk.*) echo "  shape: looks like a Mapbox public token" ;;
            '')   ;;
            *)    echo "::warning::VITE_MAPBOX_TOKEN does not start with 'pk.' — if that is a placeholder, the map will not render for any visitor" ;;
          esac
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$token" ]                || missing="$missing VITE_MAPBOX_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing (checked both Actions secrets and Actions variables)"
            echo "Where to look, in the order these actually go missing:" >&2
            echo "  1. Settings -> Secrets and variables -> Actions -> Secrets" >&2
            echo "  2. the same page's Variables tab (fine for a pk. token)" >&2
            echo "  3. an ENVIRONMENT secret — those need 'environment:' on this job," >&2
            echo "     which it deliberately does not set" >&2
            echo "  4. an ORG secret not shared with this repository" >&2
            echo "  5. the Cloudflare dashboard's Workers Builds build variables —" >&2
            echo "     a DIFFERENT store, and the one CLAUDE.md documents. A value" >&2
            echo "     there is invisible to GitHub Actions." >&2
            exit 1
          fi

      # Carried forward for the build step, whichever store it came from.
      - name: Put the map token in the environment
        env:
          MAPBOX_FROM_SECRET: ${{ secrets.VITE_MAPBOX_TOKEN }}
          MAPBOX_FROM_VAR: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          token="${MAPBOX_FROM_SECRET:-$MAPBOX_FROM_VAR}"
          # Masked explicitly: a value that arrived as a VARIABLE is not masked
          # in the log by default, and the build prints its config.
          echo "::add-mask::$token"
          echo "VITE_MAPBOX_TOKEN=$token" >> "$GITHUB_ENV"

      - run: npm ci

      # WRANGLER NEEDS AN ACCOUNT WHEN `--name` IS USED. Measured 2026-09-21 on
      # the first working run of this file: every wrangler call died with
      #
      #     ✘ [ERROR] A request to the Cloudflare API (/memberships) failed.
      #       Authentication error [code: 10000]
      #
      # because neither wrangler.jsonc nor the nitro-generated config carries an
      # `account_id`, so wrangler tried to LIST the token's accounts to pick one
      # and this token cannot read /memberships. Setting CLOUDFLARE_ACCOUNT_ID
      # skips that lookup entirely.
      #
      # An account id is an identifier, not a credential — it is in every
      # dashboard URL — but it is still read from the environment here rather
      # than written into the repo, which is this project's rule for anything
      # account-shaped. Secret or variable, either is fine.
      #
      # NOT YET EXPLAINED, and said plainly rather than guessed at:
      # deploy-jobs-cron.yml deploys with the SAME token and no account id and
      # has never hit this. The difference is `--config <file>` there against
      # `--name` here; why that changes account resolution has not been measured,
      # so this fixes the failure without claiming to understand it.
      - name: Resolve the Cloudflare account id
        env:
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          acct="${CLOUDFLARE_ACCOUNT_ID_SECRET:-$CLOUDFLARE_ACCOUNT_ID_VAR}"
          if [ -z "$acct" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set (secret or variable)"
            echo "Without it wrangler calls /memberships to choose an account, and" >&2
            echo "this token cannot read that endpoint. The id is printed in this" >&2
            echo "workflow's own earlier logs, in the account table wrangler shows" >&2
            echo "on failure, and in every dash.cloudflare.com URL." >&2
            exit 1
          fi
          echo "::add-mask::$acct"
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"

      # Recorded BEFORE the deploy, because it is the only cheap way back.
      #
      # THE TWO LISTINGS ARE NOT EQUALLY IMPORTANT, and the first cut of this
      # step treated them as if they were — then failed the whole deploy because
      # the PREVIEW had nothing to list. Measured 2026-09-21:
      #
      #     ✘ [ERROR] /accounts/…/workers/scripts/employsi-preview/versions
      #       Could not route … perhaps your object identifier is invalid?
      #       [code: 7003]
      #
      # which on a script path means that Worker has no versions to return.
      # CLAUDE.md records the same thing from the other side: attaching the
      # build connection bumped employsi-preview's modified_on with no version
      # behind it. A Worker with no history has no rollback point — that is a
      # fact to print, not a reason to refuse to deploy to it.
      #
      # PRODUCTION'S LISTING IS DIFFERENT AND IS FATAL. It is the baseline the
      # post-deploy check compares against, and a check with no baseline is the
      # `|| true` mistake again wearing a different hat: it cannot tell "nothing
      # changed" from "nothing was looked at".
      - name: What is live now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx wrangler versions list --name employsi-preview > before-preview.txt 2>&1; then
            echo "employsi-preview, before:"; tail -12 before-preview.txt
          else
            echo "::notice::employsi-preview has no listable versions yet — no rollback point for it."
            echo "That is expected for a Worker that has never been deployed to."
            tail -6 before-preview.txt
          fi
          if ! npx wrangler versions list --name benridgwell-globe-gazer-hr > before-prod.txt 2>&1; then
            echo "::error::Could not list PRODUCTION's versions, so there is no baseline to prove"
            echo "::error::this deploy left it alone. Refusing to deploy without one."
            tail -20 before-prod.txt
            exit 1
          fi
          echo "production baseline recorded"

      - name: Build and deploy to employsi-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # VITE_MAPBOX_TOKEN and CLOUDFLARE_ACCOUNT_ID come from GITHUB_ENV, set
        # above from whichever store holds them.
        #
        # `set -o pipefail` IS LOAD-BEARING AND WAS MISSING. A pipeline's exit
        # status is its LAST command's, so `deploy | tee` reports tee's success
        # however badly wrangler failed. Measured 2026-09-21: the deploy died on
        # the /memberships auth error, uploaded nothing, and this step was
        # marked green — the run only failed later, by luck, in the verify step.
        # A deploy that fails silently is the exact failure this file's comments
        # spend their length warning about.
        run: |
          set -o pipefail
          npm run deploy:preview 2>&1 | tee deploy.txt

      # THE REAL TOKEN HAS TO BE IN THE BUNDLE. A build made with a dummy value
      # deploys happily and breaks the map for everyone, so this asserts the
      # shape of a real Mapbox public token is present in the built assets.
      - name: The map token is actually in the bundle
        run: |
          if ! grep -rlq "pk\.eyJ" .output/public/; then
            echo "::error::No Mapbox public token (pk.eyJ...) in .output/public — the map will not render"
            exit 1
          fi
          echo "map token present in the built assets"

      # A GREEN DEPLOY SAYS NOTHING ABOUT WHICH WORKER IT WROTE. Both of these
      # must hold: the preview moved, and production did not.
      - name: Verify it landed on the preview and not on production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler versions list --name employsi-preview 2>&1 | tee after-preview.txt
          npx wrangler versions list --name benridgwell-globe-gazer-hr 2>&1 | tee after-prod.txt

          # COMPARE VERSION IDS, NOT THE WHOLE OUTPUT. The first cut diffed the
          # raw text and cried PRODUCTION CHANGED on a run that deployed nothing
          # at all: wrangler prints its own log-file path, which carries a
          # timestamp, plus an "update available" banner. Two calls seconds apart
          # can never be byte-equal, so that check could only ever false-alarm —
          # and, worse, it "passed" the production half for the wrong reason
          # whenever both files happened to be identical error text.
          ids() { grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$1" | sort -u; }
          # before-preview.txt is ALLOWED to be empty — a Worker deployed to for
          # the first time has no prior version. The other three are not: an
          # empty one means the listing failed, and comparing two failures is
          # not a check.
          for f in after-preview.txt before-prod.txt after-prod.txt; do
            if [ -z "$(ids $f)" ]; then
              echo "::error::$f contains no version ids — the listing failed, so nothing here was verified"
              sed -n '1,25p' "$f"
              exit 1
            fi
          done
          if [ "$(ids before-prod.txt)" = "$(ids after-prod.txt)" ]; then
            echo "production UNCHANGED — same version ids before and after"
          else
            echo "::error::PRODUCTION CHANGED. This workflow must never touch it — check that"
            echo "::error::package.json deploy:preview still carries --name employsi-preview."
            diff <(ids before-prod.txt) <(ids after-prod.txt) || true
            exit 1
          fi
          if [ "$(ids before-preview.txt)" = "$(ids after-preview.txt)" ]; then
            echo "::error::employsi-preview gained no new version — the deploy went somewhere else, or did not happen"
            exit 1
          fi
          if [ -z "$(ids before-preview.txt)" ]; then
            echo "employsi-preview has its FIRST version — nothing to roll back to before this"
          else
            echo "employsi-preview has a new version"
          fi

      # THE APP IS AT /app; / is the waitlist on every host. Reading the title is
      # how you tell them apart — see CLAUDE.md.
      - name: Check the app answers
        run: |
          url=https://employsi-preview.employsi.workers.dev/app
          code=$(curl -s -o page.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
          title=$(grep -o '<title>[^<]*' page.html | head -1 | sed 's/<title>//')
          echo "$code  $title"
          [ "$code" = "200" ] || { echo "::error::$url answered $code"; exit 1; }
          case "$title" in
            *"labour-market globe"*) echo "serving the APP" ;;
            *) echo "::warning::/app did not return the app title — got: $title" ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo '## employsi-preview'
            echo
            echo "Reason: ${{ inputs.reason || '(none given)' }}"
            echo
            echo '**https://employsi-preview.employsi.workers.dev/app**'
            echo
            echo 'The app is at `/app`. A link to `/` shows the waitlist.'
            echo
            echo '### Deploy'
            echo '```'
            tail -25 deploy.txt 2>/dev/null || echo 'the deploy did not run'
            echo '```'
            echo
            echo 'Rollback: `npx wrangler rollback <version-id> --name employsi-preview --message "why"`'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-preview
          path: |
            deploy.txt
            before-preview.txt
            after-preview.txt
            before-prod.txt
            after-prod.txt
          if-no-files-found: ignore
          retention-days: 14
