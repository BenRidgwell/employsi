# Deploy a PREVIEW Worker — the thing you send someone to look at. Two targets,
# chosen at dispatch:
#
#   app   -> https://employsi-preview.employsi.workers.dev/app       (the map)
#   site  -> https://employsi-site-preview.employsi.workers.dev/     (the website)
#
# Same codebase, same build — every Worker here serves both the marketing pages
# and /app. They are separate Workers so the website can be reviewed without
# redeploying over whatever app change is being looked at on the app preview,
# and vice versa. Neither is production.
#
# WHY THIS EXISTS. Until now there was no automated path to the preview Worker
# at all. `npm run deploy:preview` is in package.json, but nothing in .github/
# ran it, so refreshing the preview meant a shell with two tokens in it. The
# dashboard-side Workers Builds pipeline does NOT do this job: it publishes to
# the Worker the repo is CONNECTED to — today `employsi` — and it ignores the
# `--name` in the deploy command entirely (measured 2026-09-21; see CLAUDE.md).
#
# IN A GITHUB ACTION `--name` DOES STEER THE DEPLOY. That is the difference
# between this file and Workers Builds, and it is the whole safety story here:
# wrangler run from an ordinary shell publishes to the name on the command line,
# and only Cloudflare's own build pipeline overrides it. So this workflow can
# target the preview Worker and Workers Builds cannot.
#
# **`npx wrangler deploy` WITHOUT `--name` IS PRODUCTION — employsi.com.au.**
# The `--name` lives in `deploy:preview` / `deploy:site-preview` in package.json
# rather than being written here, so the target is reviewable in the repo. If
# either script is ever edited to drop the flag, THIS WORKFLOW PUBLISHES THE
# LIVE SITE.
# The verify step below exists to catch exactly that, after the fact.
#
# MANUAL ONLY, deliberately. There is no `on: push`. An app deploy that happens
# because someone merged a branch is the blast radius this repo keeps closing.
#
# THE APP IS AT /app. `/` is the marketing landing page on every host, so an
# app reviewer is sent to /app and a website reviewer to /.
#
# It shares the PRODUCTION D1 and KV, on purpose — the point of the preview is
# real data. Reads are free; anything that writes needs thinking about first.

name: deploy-preview

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which preview: app (employsi-preview) or site (employsi-site-preview)'
        type: choice
        options: [app, site]
        default: app
      reason:
        description: 'What is being previewed (goes in the run summary)'
        type: string
        required: false

concurrency:
  group: deploy-preview-${{ inputs.target || 'app' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, for the "(preview)" version label below. Shallow history is
          # fine; only the release tags are needed.
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ONE PLACE maps the choice to a Worker and a package.json script; every
      # later step reads $WORKER / $DEPLOY_SCRIPT / $CHECK_PATH. A choice input
      # cannot carry any other value, and the case below refuses one anyway.
      - name: Resolve the target
        env:
          TARGET: ${{ inputs.target || 'app' }}
        run: |
          case "$TARGET" in
            app)  w=employsi-preview;      script=deploy:preview;      path=/app ;;
            site) w=employsi-site-preview; script=deploy:site-preview; path=/ ;;
            *)    echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac
          {
            echo "WORKER=$w"
            echo "DEPLOY_SCRIPT=$script"
            echo "CHECK_PATH=$path"
          } >> "$GITHUB_ENV"
          echo "target $TARGET -> Worker $w via npm run $script"

      # VITE_MAPBOX_TOKEN IS A BUILD-TIME INLINE, not a Worker secret: vite bakes
      # it into the bundle, and a Worker secret is not visible to the build.
      # vite.config.ts throws without it, which is the guard working.
      #
      # DO NOT SATISFY IT WITH A PLACEHOLDER. The build succeeds, the deploy
      # succeeds, and the map then fails to render for every visitor — a green
      # pipeline over a broken page. Checked explicitly here so the failure names
      # what is missing instead of surfacing as a vite stack trace.
      #
      # A SECRET **OR** A VARIABLE IS ACCEPTED, and that is not laziness. A
      # Mapbox PUBLIC token (pk.…) is inlined into the client bundle and served
      # to every visitor, so it is not secret in any useful sense and
      # `Settings -> Secrets and variables -> Actions -> Variables` is a
      # perfectly reasonable home for it. The first run of this workflow failed
      # here with CLOUDFLARE_API_TOKEN present and this one empty, which is
      # exactly what a value living in the other tab looks like.
      - name: Check the tokens are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAPBOX_FROM_SECRET: ${{ secrets.VITE_MAPBOX_TOKEN }}
          MAPBOX_FROM_VAR: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          token="${MAPBOX_FROM_SECRET:-$MAPBOX_FROM_VAR}"
          if [ -n "$MAPBOX_FROM_SECRET" ]; then src="repository secret"
          elif [ -n "$MAPBOX_FROM_VAR" ]; then src="repository variable"
          else src="nowhere"; fi
          echo "VITE_MAPBOX_TOKEN source: $src"
          # Never echo the value; only its shape, which is what tells a real
          # Mapbox public token from a placeholder someone pasted to get a build.
          case "$token" in
            pk.*) echo "  shape: looks like a Mapbox public token" ;;
            '')   ;;
            *)    echo "::warning::VITE_MAPBOX_TOKEN does not start with 'pk.' — if that is a placeholder, the map will not render for any visitor" ;;
          esac
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$token" ]                || missing="$missing VITE_MAPBOX_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing (checked both Actions secrets and Actions variables)"
            echo "Where to look, in the order these actually go missing:" >&2
            echo "  1. Settings -> Secrets and variables -> Actions -> Secrets" >&2
            echo "  2. the same page's Variables tab (fine for a pk. token)" >&2
            echo "  3. an ENVIRONMENT secret — those need 'environment:' on this job," >&2
            echo "     which it deliberately does not set" >&2
            echo "  4. an ORG secret not shared with this repository" >&2
            echo "  5. the Cloudflare dashboard's Workers Builds build variables —" >&2
            echo "     a DIFFERENT store, and the one CLAUDE.md documents. A value" >&2
            echo "     there is invisible to GitHub Actions." >&2
            exit 1
          fi

      # Carried forward for the build step, whichever store it came from.
      - name: Put the map token in the environment
        env:
          MAPBOX_FROM_SECRET: ${{ secrets.VITE_MAPBOX_TOKEN }}
          MAPBOX_FROM_VAR: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          token="${MAPBOX_FROM_SECRET:-$MAPBOX_FROM_VAR}"
          # Masked explicitly: a value that arrived as a VARIABLE is not masked
          # in the log by default, and the build prints its config.
          echo "::add-mask::$token"
          echo "VITE_MAPBOX_TOKEN=$token" >> "$GITHUB_ENV"

      - run: npm ci

      # WRANGLER NEEDS AN ACCOUNT WHEN `--name` IS USED. Measured 2026-09-21 on
      # the first working run of this file: every wrangler call died with
      #
      #     ✘ [ERROR] A request to the Cloudflare API (/memberships) failed.
      #       Authentication error [code: 10000]
      #
      # because neither wrangler.jsonc nor the nitro-generated config carries an
      # `account_id`, so wrangler tried to LIST the token's accounts to pick one
      # and this token cannot read /memberships. Setting CLOUDFLARE_ACCOUNT_ID
      # skips that lookup entirely.
      #
      # An account id is an identifier, not a credential — it is in every
      # dashboard URL — but it is still read from the environment here rather
      # than written into the repo, which is this project's rule for anything
      # account-shaped. Secret or variable, either is fine.
      #
      # NOT YET EXPLAINED, and said plainly rather than guessed at:
      # deploy-jobs-cron.yml deploys with the SAME token and no account id and
      # has never hit this. The difference is `--config <file>` there against
      # `--name` here; why that changes account resolution has not been measured,
      # so this fixes the failure without claiming to understand it.
      - name: Resolve the Cloudflare account id
        env:
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          acct="${CLOUDFLARE_ACCOUNT_ID_SECRET:-$CLOUDFLARE_ACCOUNT_ID_VAR}"
          # TRIMMED AND SHAPE-CHECKED. A Cloudflare account id is 32 hex
          # characters, and a stray space or newline in the stored value does not
          # fail loudly — it produces /accounts/<junk>/workers/... and the API
          # answers "Could not route ... perhaps your object identifier is
          # invalid? [code: 7003]", which reads like the WORKER being wrong
          # rather than the account. Measured 2026-09-21: that error arrived for
          # benridgwell-globe-gazer-hr, which certainly exists and certainly has
          # versions, so "the worker has no history" was the wrong conclusion and
          # the account id became the first thing worth ruling out.
          acct="$(printf '%s' "$acct" | tr -d '[:space:]')"
          if [ -n "$acct" ] && ! printf '%s' "$acct" | grep -qiE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not 32 hex characters (length ${#acct})."
            echo "The value itself is not printed. Copy it from the Cloudflare" >&2
            echo "dashboard URL: dash.cloudflare.com/<account-id>/..." >&2
            exit 1
          fi
          if [ -z "$acct" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set (secret or variable)"
            echo "Without it wrangler calls /memberships to choose an account, and" >&2
            echo "this token cannot read that endpoint. The id is printed in this" >&2
            echo "workflow's own earlier logs, in the account table wrangler shows" >&2
            echo "on failure, and in every dash.cloudflare.com URL." >&2
            exit 1
          fi
          echo "::add-mask::$acct"
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"

      # Recorded BEFORE the deploy, because it is the only cheap way back.
      #
      # THE TWO LISTINGS ARE NOT EQUALLY IMPORTANT, and the first cut of this
      # step treated them as if they were — then failed the whole deploy because
      # the PREVIEW had nothing to list. Measured 2026-09-21:
      #
      #     ✘ [ERROR] /accounts/…/workers/scripts/employsi-preview/versions
      #       Could not route … perhaps your object identifier is invalid?
      #       [code: 7003]
      #
      # which on a script path means that Worker has no versions to return.
      # CLAUDE.md records the same thing from the other side: attaching the
      # build connection bumped employsi-preview's modified_on with no version
      # behind it. A Worker with no history has no rollback point — that is a
      # fact to print, not a reason to refuse to deploy to it.
      #
      # PRODUCTION'S LISTING IS DIFFERENT AND IS FATAL. It is the baseline the
      # post-deploy check compares against, and a check with no baseline is the
      # `|| true` mistake again wearing a different hat: it cannot tell "nothing
      # changed" from "nothing was looked at".
      - name: What is live now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # TWO LISTING COMMANDS, BECAUSE ONE OF THEM DOES NOT WORK HERE AND IT
          # IS NOT YET KNOWN WHY. Measured 2026-09-21: `versions list --name X`
          # returned 7003 for BOTH Workers, including production, which has a
          # known version history (CLAUDE.md records 2ac6eba8 replacing
          # 52e5abaa). Meanwhile deploy-jobs-cron.yml has used
          # `deployments list --config <file>` successfully all along. The
          # difference tracks `--name` against `--config`, the same split that
          # broke the deploy before the account id was set.
          #
          # So this tries versions, then deployments, and uses whichever answers
          # with version ids — and says which one worked, so the next person has
          # the measurement rather than this comment's speculation.
          listing() {
            local worker="$1" out="$2"
            if npx wrangler versions list --name "$worker" > "$out" 2>&1; then
              echo "versions"; return 0
            fi
            if npx wrangler deployments list --name "$worker" > "$out" 2>&1; then
              echo "deployments"; return 0
            fi
            return 1
          }
          if via=$(listing "$WORKER" before-preview.txt); then
            echo "$WORKER, before (via $via list):"; tail -12 before-preview.txt
          else
            echo "::notice::$WORKER has no listable versions yet — no rollback point for it."
            echo "That is expected for a Worker that has never been deployed to."
            tail -6 before-preview.txt
          fi
          if ! via_prod=$(listing benridgwell-globe-gazer-hr before-prod.txt); then
            echo "::error::Could not list PRODUCTION's versions, so there is no baseline to prove"
            echo "::error::this deploy left it alone. Refusing to deploy without one."
            tail -20 before-prod.txt
            exit 1
          fi
          echo "production baseline recorded (via $via_prod list)"
          echo "LISTING_CMD=$via_prod" >> "$GITHUB_ENV"

      - name: Build and deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # VITE_MAPBOX_TOKEN and CLOUDFLARE_ACCOUNT_ID come from GITHUB_ENV, set
        # above from whichever store holds them.
        #
        # `set -o pipefail` IS LOAD-BEARING AND WAS MISSING. A pipeline's exit
        # status is its LAST command's, so `deploy | tee` reports tee's success
        # however badly wrangler failed. Measured 2026-09-21: the deploy died on
        # the /memberships auth error, uploaded nothing, and this step was
        # marked green — the run only failed later, by luck, in the verify step.
        # A deploy that fails silently is the exact failure this file's comments
        # spend their length warning about.
        #
        # STAMPED WITH ITS COMMIT (2026-10-03). deploy-production.yml deploys
        # exactly the commit a preview is serving, and reads it from this
        # message on the preview's Worker version — so every preview deploy
        # must carry it. The arguments after `--` land on the wrangler command
        # at the end of the deploy:* script.
        #
        # VERSION LABEL: the newest release tag plus "(preview)", built in as
        # VITE_APP_VERSION (src/employsi/version.ts), so Settings on a preview
        # names the release it is ahead of. Production builds its own number.
        run: |
          set -o pipefail
          latest=$(git -c versionsort.suffix=-beta tag -l 'v*' --sort=-v:refname | head -1)
          export VITE_APP_VERSION="${latest#v} (preview)"
          # The app's tab reads "employsi - preview" on preview builds only
          # (src/routes/app.tsx). Production builds the same commit without it.
          export VITE_PREVIEW=1
          echo "Version label: $VITE_APP_VERSION"
          npm run "$DEPLOY_SCRIPT" -- --message "commit $GITHUB_SHA" --tag "${GITHUB_SHA:0:12}" \
            2>&1 | tee deploy.txt

      # A preview production cannot read the commit of cannot be promoted, so
      # confirm the stamp actually landed on the version that was just made.
      - name: The commit stamp is on the new version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          id=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.txt | awk '{print $4}')
          [ -n "$id" ] || { echo "::error::the deploy printed no version id"; exit 1; }
          npx wrangler versions view "$id" --name "$WORKER" > stamp.txt 2>&1 || true
          if grep -q "commit $GITHUB_SHA" stamp.txt; then
            echo "version $id carries commit $GITHUB_SHA — production can mirror it"
          else
            echo "::error::version $id does not carry 'commit $GITHUB_SHA', so deploy-production.yml"
            echo "::error::could not mirror this preview. Output of versions view:"
            sed -n '1,30p' stamp.txt
            exit 1
          fi

      # THE REAL TOKEN HAS TO BE IN THE BUNDLE. A build made with a dummy value
      # deploys happily and breaks the map for everyone, so this asserts the
      # shape of a real Mapbox public token is present in the built assets.
      - name: The map token is actually in the bundle
        run: |
          if ! grep -rlq "pk\.eyJ" .output/public/; then
            echo "::error::No Mapbox public token (pk.eyJ...) in .output/public — the map will not render"
            exit 1
          fi
          echo "map token present in the built assets"

      # A GREEN DEPLOY SAYS NOTHING ABOUT WHICH WORKER IT WROTE. Both of these
      # must hold: the preview moved, and production did not.
      - name: Verify it landed on the preview and not on production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          # The SAME command that produced the baseline, or the comparison is
          # measuring the difference between two tools rather than a deploy.
          npx wrangler "$LISTING_CMD" list --name "$WORKER" 2>&1 | tee after-preview.txt
          npx wrangler "$LISTING_CMD" list --name benridgwell-globe-gazer-hr 2>&1 | tee after-prod.txt

          # COMPARE VERSION IDS, NOT THE WHOLE OUTPUT. The first cut diffed the
          # raw text and cried PRODUCTION CHANGED on a run that deployed nothing
          # at all: wrangler prints its own log-file path, which carries a
          # timestamp, plus an "update available" banner. Two calls seconds apart
          # can never be byte-equal, so that check could only ever false-alarm —
          # and, worse, it "passed" the production half for the wrong reason
          # whenever both files happened to be identical error text.
          ids() { grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$1" | sort -u; }
          # before-preview.txt is ALLOWED to be empty — a Worker deployed to for
          # the first time has no prior version. The other three are not: an
          # empty one means the listing failed, and comparing two failures is
          # not a check.
          for f in after-preview.txt before-prod.txt after-prod.txt; do
            if [ -z "$(ids $f)" ]; then
              echo "::error::$f contains no version ids — the listing failed, so nothing here was verified"
              sed -n '1,25p' "$f"
              exit 1
            fi
          done
          if [ "$(ids before-prod.txt)" = "$(ids after-prod.txt)" ]; then
            echo "production UNCHANGED — same version ids before and after"
          else
            echo "::error::PRODUCTION CHANGED. This workflow must never touch it — check that"
            echo "::error::package.json $DEPLOY_SCRIPT still carries --name $WORKER."
            diff <(ids before-prod.txt) <(ids after-prod.txt) || true
            exit 1
          fi
          if [ "$(ids before-preview.txt)" = "$(ids after-preview.txt)" ]; then
            echo "::error::$WORKER gained no new version — the deploy went somewhere else, or did not happen"
            exit 1
          fi
          if [ -z "$(ids before-preview.txt)" ]; then
            echo "$WORKER has its FIRST version — nothing to roll back to before this"
          else
            echo "$WORKER has a new version"
          fi

          # VERSIONS ARE NOT DEPLOYMENTS, and confusing the two is a documented
          # trap in this repo: `wrangler secret put` UPLOADS a version without
          # deploying it, so `versions list` can show entries newer than the one
          # actually serving traffic — which reads in the dashboard as the
          # deploy having "gone a few versions back". The check above compares
          # versions, because that is what proves a deploy happened; this
          # records what is SERVING, which is what anyone looking at the Worker
          # is actually asking about.
          npx wrangler deployments list --name "$WORKER" > deployed-preview.txt 2>&1 \
            || echo '(deployments list failed — see the artifact)' >> deployed-preview.txt
          echo "--- what is SERVING $WORKER now:"
          tail -20 deployed-preview.txt

      # THE APP IS AT /app; / is the landing page on every host. Reading the
      # title is how you tell them apart — see CLAUDE.md.
      #
      # /app CANNOT BE READ ANONYMOUSLY ANY MORE, and this step used to require
      # it. The app is signed-in-only as of 2026-09-30 (getAppAccess in
      # billingFn.ts), so an unauthenticated curl gets a 302 to /login and never
      # sees the app's <title> at all. This check demanded 200 and would have
      # failed every app deploy from here on — the same trap CLAUDE.md flags for
      # deploy-production.yml's gate check, so it is changed in the commit that
      # closed the gate rather than left to fail and be puzzled over.
      #
      # THE REDIRECT IS NOW THE ASSERTION, and it is a stronger one than the
      # title was: only the app route redirects to /login, so landing there
      # proves both that this is the app and that its gate is live. A 200 with
      # the app title is still accepted, because it is the correct answer on a
      # Worker where Better Auth is not configured — authAvailable() false means
      # the gate has no door and getAppAccess deliberately stays open. Both are
      # reported, so which one a run got is on the record.
      - name: Check the preview answers
        run: |
          url="https://$WORKER.employsi.workers.dev$CHECK_PATH"
          # --compressed IS REQUIRED. Without it curl stores the gzip bytes, grep
          # calls page.html a binary file, the title comes back empty and this
          # step warns "/app did not return the app title" on a perfectly good
          # deploy. Measured 2026-09-21 on the first successful run.
          #
          # RETRIED, because a FIRST deploy is not reachable at once. Measured
          # 2026-09-28 on employsi-site-preview's first version: this check ran
          # five seconds after the upload and got 404 "Page not found" from a
          # workers.dev hostname that did not exist yet; a minute later it
          # served 200. An existing Worker answers first time, so this only
          # ever costs time on a new one.
          # A REDIRECT IS A SUCCESSFUL ANSWER HERE, so the retry stops on either —
          # it is waiting for a hostname to exist, not for a particular status.
          #
          # 307, NOT 302. TanStack Router's redirect() in a beforeLoad answers
          # 307 (measured on employsi-preview, 2026-09-30). This check was
          # written against 302 from habit and would have failed the very deploy
          # it was added for. Matched as 3xx rather than pinned to 307, because
          # which redirect status the framework picks is its choice, not ours —
          # what matters is where it sends an unauthenticated visitor.
          for wait in 0 5 10 20 30; do
            sleep "$wait"
            read -r code location < <(curl -s --compressed -o page.html \
              -w '%{http_code} %{redirect_url}\n' --max-time 30 "$url" || echo "000 -")
            case "$code" in 200|3[0-9][0-9]) break ;; esac
            echo "attempt answered $code; retrying"
          done
          title=$(grep -ao '<title>[^<]*' page.html | head -1 | sed 's/<title>//')
          echo "$code  ${location:-$title}"

          case "$CHECK_PATH" in
            /app)
              case "$code" in
                3[0-9][0-9])
                  case "$location" in
                    */login*) echo "serving the APP — signed out, $code to /login as expected" ;;
                    *) echo "::error::/app answered $code to $location, not /login"; exit 1 ;;
                  esac ;;
                200)
                  case "$title" in
                    # The app's <title>: "employsi - preview" on a preview build,
                    # "Employsi" otherwise (src/routes/app.tsx).
                    "employsi - preview"|"Employsi")
                      echo "::warning::/app served the app to an ANONYMOUS request." \
                           "Expected on a Worker without Better Auth configured" \
                           "(authAvailable false); on one with it, the sign-in gate is not working." ;;
                    *) echo "::error::/app answered 200 but is not the app — got: $title"; exit 1 ;;
                  esac ;;
                *) echo "::error::$url answered $code"; exit 1 ;;
              esac ;;
            /)
              [ "$code" = 200 ] || { echo "::error::$url answered $code"; exit 1; }
              case "$title" in
                *"Explore the world of work"*) echo "serving the WEBSITE" ;;
                *) echo "::warning::/ did not return the expected title — got: $title" ;;
              esac ;;
          esac

      # `reason` GOES THROUGH env, NOT THROUGH ${{ }} IN THE SCRIPT BODY.
      # A ${{ }} expression is pasted into the script TEXT before bash sees it,
      # so whatever was typed into the dispatch form is executed as shell. This
      # is not theoretical: the first run to carry a reason containing backticks
      # died on `where: command not found`, because the backticks in the message
      # ran as command substitution on the runner. An env var is expanded by
      # bash after parsing, so the value can never become code.
      - name: Summary
        if: always()
        env:
          REASON: ${{ inputs.reason || '(none given)' }}
        run: |
          {
            echo "## $WORKER"
            echo
            echo "Reason: $REASON"
            echo
            echo "**https://$WORKER.employsi.workers.dev$CHECK_PATH**"
            echo
            echo 'The app is at `/app`; `/` is the website landing page.'
            echo
            echo '### Version deployed by this run'
            echo '```'
            grep -aE 'Current Version ID|Uploaded|Deployed ' deploy.txt 2>/dev/null \
              || echo 'the deploy did not run'
            echo '```'
            echo
            echo "### What is SERVING $WORKER now"
            echo
            echo 'A Worker can hold versions NEWER than the one serving traffic —'
            echo '`wrangler secret put` uploads one without deploying it. So a'
            echo 'dashboard that looks "a few versions back" is usually this, not a'
            echo 'deploy that went backwards. This is the active deployment:'
            echo
            echo '```'
            tail -20 deployed-preview.txt 2>/dev/null || echo '(not recorded)'
            echo '```'
            echo
            echo '### Full deploy output'
            echo '```'
            tail -25 deploy.txt 2>/dev/null || echo 'the deploy did not run'
            echo '```'
            echo
            echo "Rollback: \`npx wrangler rollback <version-id> --name $WORKER --message \"why\"\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-preview
          path: |
            deploy.txt
            before-preview.txt
            after-preview.txt
            before-prod.txt
            after-prod.txt
            deployed-preview.txt
          if-no-files-found: ignore
          retention-days: 14
