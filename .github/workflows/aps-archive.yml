# Daily APS (federal) Government → D1 archive (hosted, off your PC).
#
# apsjobs.gov.au is a Salesforce Experience Cloud (Aura) site: results come from
# a session-gated ApexAction and render only after the page's JS runs. So it
# needs a browser — and, measured, NOTHING ELSE.
#
# This file used to say the opposite: that a headless Chromium on a runner does
# not work because the datacenter IP is bot-blocked, and that the fetch
# therefore went through Oxylabs. That was wrong, and it stayed here contradicting
# the steps below after the feed was ported on 2026-08-04. What the board
# refuses is a request with no JavaScript, not a datacentre ADDRESS: a local
# Playwright Chromium on an ordinary runner reads the board fine. The proxy was
# only ever supplying a browser we can run ourselves.
#
# Five consecutive scheduled runs on the local-browser path (2026-08-04 through
# 2026-08-08) succeeded, most recently 15 vacancies in 33 seconds. `--oxylabs`
# restores the proxy path unchanged if that ever stops being true.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — a token with D1 edit on the employsi account
#                           (the same one the SEEK workflow uses).
# Optional repo variables (fall back to the values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + GitHub notification) if the Aura JSON yields no
# jobs — the degradation signal. Use "Run workflow" (workflow_dispatch) to verify
# it on the runner before relying on the schedule.

name: aps-archive

on:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC daily — staggered after the SA run
  workflow_dispatch: {}

concurrency:
  group: aps-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      # Playwright drives the render locally now — the proxy was only ever
      # supplying a browser for this board, not a residential IP.
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape APS → D1 (rendered, local browser)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/aps-to-d1.py --max-pages 40
