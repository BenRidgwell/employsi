# Daily APS (federal) Government → D1 archive (hosted, off your PC).
#
# apsjobs.gov.au is a Salesforce Experience Cloud (Aura) site: results come from
# a session-gated ApexAction and render only after the page's JS runs. A headless
# Chromium on GitHub's runner does NOT work — the datacenter IP is bot-blocked and
# the run scraped 0 vacancies. So this fetches through the Oxylabs Web Scraper API
# (residential IP + server-side JS render) and parses the finished DOM — no
# browser, same path as the Indeed/LinkedIn/NSW archives.
#
# Required repo secrets:
#   OXYLABS_USERNAME, OXYLABS_PASSWORD  — Oxylabs Web Scraper API credentials
#   CLOUDFLARE_API_TOKEN  — a token with D1 edit on the employsi account
#                           (the same one the SEEK workflow uses).
# Optional repo variables (fall back to the values baked into the script):
#   CF_ACCOUNT_ID, D1_DATABASE_ID
#
# The job exits non-zero (red X + GitHub notification) if the Aura JSON yields no
# jobs — the degradation signal. Use "Run workflow" (workflow_dispatch) to verify
# it on the runner before relying on the schedule.

name: aps-archive

on:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC daily — staggered after the SA run
  workflow_dispatch: {}

concurrency:
  group: aps-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      - name: Scrape APS → D1 (Oxylabs)
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/aps-to-d1.py --max-pages 40
